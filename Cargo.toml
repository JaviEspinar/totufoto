[package]
name = "totufoto"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"

[workspace]
members = ["desktop"]

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dunce = "1"
clap = { version = "4", features = ["derive"] }
fast_image_resize = { version = "6", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif", "bmp", "rayon"] }
kamadak-exif = "0.6"
# load-dynamic: use the official ONNX Runtime shared library (runtime CPU dispatch, works without AVX2)
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "tracing", "load-dynamic", "api-27"] }
rayon = "1"
reverse_geocoder = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net"] }
tower-http = { version = "0.7", features = ["compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
libloading = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
