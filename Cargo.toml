[workspace]
members = ["desktop"]
# Plain `cargo build`, `test` and `clippy` cover the library and the command-line app, which
# build without the face models; the desktop app needs them (`-p imadive-desktop`, see
# scripts/fetch-*).
default-members = ["."]

# Shared by both packages; the desktop app's tauri.conf.json takes its version from here too.
[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.93" # checked in CI; reverse_geocoder needs it (through `fixed`)
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/JaviEspinar/totufoto"
homepage = "https://github.com/JaviEspinar/totufoto"
authors = ["waiting4timeout (https://github.com/waiting4timeout)"]

[package]
name = "imadive"
description = "Fast local photo gallery: timeline, places, upcoming anniversaries and people found by face recognition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["photos", "gallery", "face-recognition", "exif", "self-hosted"]
categories = ["multimedia::images", "web-programming::http-server"]
publish = false

# The command-line app needs clap and cliclack; the desktop app uses the library without them.
[features]
default = ["cli"]
cli = ["dep:clap", "dep:cliclack"]

[[bin]]
name = "imadive"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = "0.4"
dunce = "1"
clap = { version = "4", features = ["derive", "env"], optional = true }
fast_image_resize = { version = "6", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif", "bmp", "rayon"] }
kamadak-exif = "0.6"
# load-dynamic: use the official ONNX Runtime shared library (runtime CPU dispatch, works without AVX2)
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "tracing", "load-dynamic", "api-27"] }
rayon = "1"
reverse_geocoder = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "sync", "time"] }
tower-http = { version = "0.7", features = ["compression-gzip", "fs"] }
# Already used by axum: to serve videos with tower-http's file service (and in tests).
tower = { version = "0.5", default-features = false, features = ["util"] }
# Already used by axum: to rewrite a video's bytes as they stream (videos without sound).
futures-util = { version = "0.3", default-features = false }
tracing = "0.1"
blake3 = "1"
trash = "5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
# The server's setup wizard (`imadive setup`), in the command-line app only.
cliclack = { version = "0.5.6", optional = true }

[target.'cfg(windows)'.dependencies]
libloading = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
# Smaller downloads; panics still report the file and line.
strip = "symbols"

[profile.dev.package."*"]
opt-level = 3
