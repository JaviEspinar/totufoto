name: An idea
description: Something Imadive could do, or do better
labels: [idea]
body:
  - type: textarea
    id: need
    attributes:
      label: What you would like to do
      description: The situation and what's missing, in your words. How you'd solve it is welcome too, but the need comes first.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: A workaround, another app, or not at all.
