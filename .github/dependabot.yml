# Weekly dependency updates, one grouped pull request per ecosystem. The workflows pin
# actions to commit SHAs; Dependabot moves the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Both packages of the workspace share Cargo.lock at the root.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web/tests
    schedule:
      interval: monthly
    groups:
      ui-tests:
        patterns: ["*"]
