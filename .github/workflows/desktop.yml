name: Desktop apps

# Builds the Windows and Linux desktop apps and checks each one with its self-test on
# every push to main. For a version tag (v*) it also attaches them to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04 # oldest supported glibc, so the AppImage runs on most distros
          - name: windows-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Face models and ONNX Runtime (Linux)
        if: runner.os == 'Linux'
        run: scripts/fetch-models.sh && scripts/fetch-onnxruntime.sh

      - name: Face models and ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/fetch-models.ps1
          ./scripts/fetch-onnxruntime.ps1

      - name: Build AppImage
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build --bundles appimage
          mkdir -p ../dist
          cp ../target/release/bundle/appimage/*.AppImage "../dist/Totufoto-${VERSION}-linux-x86_64.AppImage"

      - name: Build exe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release -p totufoto-desktop --features custom-protocol
          mkdir -p dist
          cp target/release/totufoto-desktop.exe "dist/Totufoto-${VERSION}-windows-x64.exe"

      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1" # runners have no FUSE
        run: |
          app=$(ls dist/*.AppImage)
          chmod +x "$app"
          set +e
          # Relative paths also work (resolved from the launch folder); absolute keeps it explicit.
          "$app" --self-test "$PWD/fixtures/photos" "$PWD/report.txt" > out.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # Tell a packaging problem apart from an app problem: run the binary outside the AppImage.
            echo "--- AppImage exit code $code; running the extracted binary" >> out.txt
            "$app" --appimage-extract > /dev/null 2>&1
            ./squashfs-root/usr/bin/totufoto-desktop --self-test "$PWD/fixtures/photos" >> out.txt 2>&1
            echo "extracted binary exit code: $?" >> out.txt
            ldd ./squashfs-root/usr/bin/totufoto-desktop | grep "not found" >> out.txt
          fi
          cat out.txt
          # Also as an annotation, which shows on the run page without opening the log.
          level=$([ $code -eq 0 ] && echo notice || echo error)
          echo "::$level title=Self-test (Linux)::$(tail -n 60 out.txt | sed 's/\x1b\[[0-9;]*m//g' | awk '{printf "%s%%0A", $0}')"
          exit $code

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The exe is a GUI app, so wait for it explicitly and read the report file.
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test', 'fixtures\photos', 'report.txt' -Wait -PassThru -NoNewWindow
          $report = if (Test-Path report.txt) { Get-Content report.txt -Raw } else { "no report written" }
          Write-Output $report
          $level = if ($p.ExitCode -eq 0) { "notice" } else { "error" }
          Write-Output "::$level title=Self-test (Windows)::$($report -replace "`r?`n", '%0A')"
          exit $p.ExitCode

      - uses: actions/upload-artifact@v7
        with:
          name: totufoto-${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job publishes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # Written notes for this version, if any (release-notes/<tag>.md); GitHub's changelog
      # link is added below them.
      - name: Release notes
        shell: bash
        run: |
          notes="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cp "$notes" notes.md; else : > notes.md; fi
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
