name: Desktop apps

# Builds the Windows and Linux desktop apps (an exe; an AppImage for any distribution and a
# .deb for Debian and Ubuntu) and checks each one with its self-test. For a
# version tag (v*) it also publishes them as a GitHub Release, with checksums and build
# provenance. A push to main builds them when Rust code, dependencies or packaging change,
# not for documentation, UI or test changes (ci.yml covers those); it can also be run by
# hand. Path filters don't apply to tags, so a release always builds.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/**"
      - "fixtures/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a build in progress; releases always finish.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04 # oldest supported glibc, so the AppImage runs on most distros
          - name: windows-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # For a release, the tag must match the version in Cargo.toml, have written notes, and
      # the README's download links must point at it, checked before anything is built.
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            if [ "$v" != "$cargo_version" ]; then
              echo "::error title=Version::tag $GITHUB_REF_NAME, but Cargo.toml says $cargo_version"
              exit 1
            fi
            if [ ! -s "release-notes/$GITHUB_REF_NAME.md" ]; then
              echo "::error title=Release notes::release-notes/$GITHUB_REF_NAME.md is missing or empty"
              exit 1
            fi
            if ! scripts/check-download-links.sh "$v"; then
              echo "::error title=README::the download links don't point at $v (scripts/release.sh updates them)"
              exit 1
            fi
          else
            v="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Face models and ONNX Runtime (Linux)
        if: runner.os == 'Linux'
        run: scripts/fetch-models.sh && scripts/fetch-onnxruntime.sh

      - name: Face models and ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/fetch-models.ps1
          ./scripts/fetch-onnxruntime.ps1

      - name: Tauri CLI
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: tauri-cli@2

      - name: Build AppImage and .deb
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          cargo tauri build --bundles appimage,deb
          mkdir -p ../dist
          cp ../target/release/bundle/appimage/*.AppImage "../dist/Imadive-${VERSION}-linux-x86_64.AppImage"
          cp ../target/release/bundle/deb/*.deb "../dist/Imadive-${VERSION}-linux-amd64.deb"
          dpkg-deb --info ../dist/*.deb

      - name: Build exe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release -p imadive-desktop --features custom-protocol
          mkdir -p dist
          cp target/release/imadive-desktop.exe "dist/Imadive-${VERSION}-windows-x64.exe"

      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1" # runners have no FUSE
        run: |
          app=$(ls dist/*.AppImage)
          chmod +x "$app"
          set +e
          # Relative paths also work (resolved from the launch folder); absolute keeps it explicit.
          "$app" --self-test "$PWD/fixtures/photos" "$PWD/report.txt" > out.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # Tell a packaging problem apart from an app problem: run the binary outside the AppImage.
            echo "--- AppImage exit code $code; running the extracted binary" >> out.txt
            "$app" --appimage-extract > /dev/null 2>&1
            ./squashfs-root/usr/bin/imadive-desktop --self-test "$PWD/fixtures/photos" >> out.txt 2>&1
            echo "extracted binary exit code: $?" >> out.txt
            ldd ./squashfs-root/usr/bin/imadive-desktop | grep "not found" >> out.txt
          fi
          cat out.txt
          # Also as an annotation, which shows on the run page without opening the log.
          level=$([ $code -eq 0 ] && echo notice || echo error)
          echo "::$level title=Self-test (Linux)::$(tail -n 60 out.txt | sed 's/\x1b\[[0-9;]*m//g' | awk '{printf "%s%%0A", $0}')"
          exit $code

      # In a clean Debian 12, the oldest system the package is for: installing it must bring
      # everything it needs, and the program it installs must pass the self-test.
      - name: Self-test (.deb on Debian 12)
        if: runner.os == 'Linux'
        run: |
          set +e
          docker run --rm -v "$PWD:/w" -w /w debian:12 bash -c '
            apt-get update -qq && apt-get install -y -qq ./dist/*.deb > /dev/null || exit 3
            bin=$(dpkg -L imadive | grep "^/usr/bin/" | head -1)
            echo "installed: $bin"
            "$bin" --self-test /w/fixtures/photos' > out-deb.txt 2>&1
          code=$?
          cat out-deb.txt
          level=$([ $code -eq 0 ] && echo notice || echo error)
          echo "::$level title=Self-test (.deb on Debian 12)::$(tail -n 40 out-deb.txt | sed 's/\x1b\[[0-9;]*m//g' | awk '{printf "%s%%0A", $0}')"
          exit $code

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The exe is a GUI app, so wait for it explicitly and read the report file.
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test', 'fixtures\photos', 'report.txt' -Wait -PassThru -NoNewWindow
          $report = if (Test-Path report.txt) { Get-Content report.txt -Raw } else { "no report written" }
          Write-Output $report
          $level = if ($p.ExitCode -eq 0) { "notice" } else { "error" }
          Write-Output "::$level title=Self-test (Windows)::$($report -replace "`r?`n", '%0A')"
          exit $p.ExitCode

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imadive-${{ matrix.name }}
          path: dist/*
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job writes: the release itself, and the signed provenance of each file.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      # Lets anyone check a download: `sha256sum -c SHA256SUMS`, or
      # `gh attestation verify <file> --repo <owner>/<repo>` for where and how it was built.
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # The written notes (checked by the build job); GitHub's changelog link is added below.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: release-notes/${{ github.ref_name }}.md
          generate_release_notes: true
