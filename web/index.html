</dialog>

<dialog id="mergeDlg" aria-labelledby="mergeTitle">
  <div class="dlg-head"><h3 id="mergeTitle">Same person as…</h3><button data-close title="Close">✕</button></div>
  <div class="dlg-body">
    <div id="mergePick">
      <p id="mergeHint"></p>
      <input class="search" id="mergeFilter" type="search" placeholder="Search people" autocomplete="off">
      <div class="candidates"></div>
    </div>
    <div id="mergeConfirm" hidden></div>
  </div>
</dialog>

<dialog id="browseDlg" aria-labelledby="browseTitle">
  <div class="dlg-head"><h3 id="browseTitle">Add a photo folder</h3><button data-close title="Close">✕</button></div>
  <div class="dlg-body">
    <p>Folders on the computer running Imadive. Open a folder, then add it; its subfolders are included.</p>
    <div class="browse-path">
      <button class="btn" data-up title="Folder above" aria-label="Folder above">↑</button>
      <input id="browsePath" spellcheck="false" autocomplete="off" aria-label="Folder path" title="Type or paste a path and press Enter">
    </div>
    <div class="browse-list"></div>
    <div class="err"></div>
    <div class="dlg-actions"><button class="btn" data-close>Cancel</button><button class="btn primary" data-add-here>Add this folder</button></div>
  </div>
</dialog>

<dialog id="aboutDlg" class="about-dlg" aria-label="About Imadive">
  <div class="dlg-head"><button data-close title="Close">✕</button></div>
  <div class="dlg-body">
    <div class="about-art"></div>
    <p class="about-version"></p>
    <p class="about-coffee"></p>
  </div>
</dialog>

<dialog id="settingsDlg" aria-labelledby="settingsTitle">
  <div class="dlg-head"><h3 id="settingsTitle">Settings</h3><button data-close title="Close">✕</button></div>
  <div class="dlg-body"></div>
</dialog>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Photo">
  <div class="stage">
    <button class="close" title="Close (Esc)" aria-label="Close">✕</button>
    <button class="trash" title="Delete this photo (Delete key)" aria-label="Delete this photo"><svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><use href="#i-trash"/></svg></button>
    <button class="nav prev" title="Previous (←)">‹</button>
    <div class="frame"><img alt=""><div class="boxes"></div></div>
    <button class="nav next" title="Next (→)">›</button>
  </div>
  <div class="info">
    <button class="icon-btn small info-toggle" id="infoToggle" aria-expanded="true" title="Hide the details (I)">
      <span class="when-open"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><use href="#i-panel-hide" transform="matrix(-1 0 0 1 24 0)"/></svg></span><span class="when-closed"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><use href="#i-panel-show" transform="matrix(-1 0 0 1 24 0)"/></svg></span>
    </button>
    <div class="info-body"></div>
  </div>
</div>

<script type="module" src="/js/{{assets}}/main.js"></script>
</body>
</html>
