<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Totufoto</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1c1b19; --muted: #6d6a64; --line: #e4e1da;
  --accent: #2f6fdf; --accent-ink: #ffffff; --chip: #eceae4; --hover: #efede8;
  --row: 200px; --gap: 4px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121211; --panel: #1b1b1a; --ink: #edebe6; --muted: #9a968e; --line: #2c2b29;
    --accent: #6b9cff; --accent-ink: #0d0d0c; --chip: #262523; --hover: #232321;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  display: grid; grid-template-columns: 260px 1fr; grid-template-rows: auto minmax(0, 1fr);
  /* the real visible height, also on phones with collapsing browser bars */
  height: 100vh; height: 100dvh; overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

header {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 16px;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
.brand { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; margin-right: 8px; }
nav { display: flex; gap: 2px; }
nav button, .seg button {
  border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; color: var(--muted);
}
nav button:hover, .seg button:hover { background: var(--hover); color: var(--ink); }
nav button.on, .seg button.on { background: var(--chip); color: var(--ink); font-weight: 600; }
.spacer { flex: 1; }
.head-buttons { display: flex; align-items: center; gap: 2px; }
.head-buttons .icon-btn { position: relative; }
#peopleBtn, #viewBtn { display: none; }
.icon-btn .badge {
  position: absolute; top: 2px; right: 0; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; line-height: 16px;
}
.icon-btn .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.icon-btn .badge[hidden], .icon-btn .dot[hidden] { display: none; }
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); z-index: 14; display: none; }
.chip { max-width: 100%; }
.chip .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tools { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.tools select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.range { display: flex; align-items: center; gap: 6px; }
.compact-only { display: none; }
.range input { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; font-size: 13px; }
/* Dates, grouping and order only apply to Photos and Upcoming */
body.no-aside .range, body.no-aside .tools { display: none; }

/* Icon buttons: just the icon, with a soft highlight on hover */
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0;
  border: 0; background: transparent; border-radius: 8px; color: var(--muted);
}
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.dlg-body h4 { margin: 18px 0 4px; font-size: 13px; }
.dlg-body h4:first-child { margin-top: 4px; }
.scan-state { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.scan-state .what { flex: 1; font-size: 13px; }
.scan-state .what small { display: block; color: var(--muted); font-size: 12px; }
.scan-state progress { width: 100%; margin-top: 6px; accent-color: var(--accent); }
.failures { margin-top: 10px; }
.failures details { margin-top: 6px; font-size: 12px; }
.failures summary { cursor: pointer; color: var(--accent); }
.failures ul { list-style: none; margin: 6px 0 0; padding: 0; max-height: 180px; overflow-y: auto; }
.failures li { display: flex; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.failures li .p { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.failures li .why { color: var(--muted); flex: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.failures li.more { color: var(--muted); }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 10px;
}
.btn:hover { background: var(--hover); }

aside {
  background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto;
  padding: 14px 12px; min-height: 0;
}
aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 4px 4px 8px; }
.aside-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.aside-head h3 { margin: 0 4px; }
.aside-head h3 { flex: 1; white-space: nowrap; overflow: hidden; }
.icon-btn.small { width: 30px; height: 30px; flex: none; margin: -4px -6px -4px 0; }
.icon-btn .when-closed, body.aside-collapsed .icon-btn .when-open { display: none; }
body.aside-collapsed .icon-btn .when-closed { display: inline-flex; }
/* Collapsed: a thin strip with the button to open it again, and how many are selected */
body { transition: grid-template-columns 0.2s ease; }
body.aside-collapsed { grid-template-columns: 48px 1fr; }
body.aside-collapsed aside { padding: 14px 10px; overflow: hidden; }
body.aside-collapsed aside > :not(.aside-head), body.aside-collapsed .aside-head h3 { display: none; }
body.aside-collapsed .aside-head { flex-direction: column; align-items: center; }
.rail-count {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink);
  font-size: 11px; font-weight: 600; display: none; align-items: center; justify-content: center; margin-top: 6px;
}
body.aside-collapsed .rail-count:not([hidden]) { display: inline-flex; }
.seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; margin-bottom: 10px; }
.seg button { flex: 1; padding: 5px 4px; font-size: 12px; }
.person {
  display: flex; align-items: center; gap: 10px; padding: 5px 6px; border-radius: 8px; cursor: pointer;
  user-select: none;
}
.person:hover { background: var(--hover); }
.person input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.person img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: var(--chip); }
.person .n {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text;
  border-radius: 4px; padding: 1px 3px; margin: -1px -3px;
}
.person .n:hover { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.person .rename {
  flex: 1; min-width: 0; font: inherit; border: 1px solid var(--accent); border-radius: 4px; padding: 1px 3px;
  margin: -2px -4px; background: var(--panel); outline: none;
}
.person .n.unnamed { color: var(--muted); font-style: italic; }
.person .c { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.empty-side { color: var(--muted); font-size: 13px; padding: 4px; }
.search {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; margin-bottom: 8px;
}
.more { color: var(--muted); font-size: 12px; padding: 6px; }
.people-bar { display: flex; align-items: center; gap: 12px; padding-top: 16px; color: var(--muted); }
.people-bar .search { max-width: 320px; margin: 0; }
.people-bar .zoom { margin-left: auto; }
.people-bar select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; color: var(--ink); }
.people-bar .seg { margin: 0; }
.people-bar .seg button { padding: 5px 12px; }
/* The People tab has no "People in the photo" column */
body.no-aside { grid-template-columns: 1fr; }
body.no-aside aside { display: none; }
.candidates { max-height: 50vh; overflow-y: auto; margin-top: 8px; }
.candidate { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 8px; cursor: pointer; }
.candidate:hover { background: var(--hover); }
.candidate .avatar-sm { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: var(--chip); flex: none; }
.candidate .avatar-sm img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 0.2s; }
.candidate .avatar-sm img.ok { opacity: 1; }
.candidate .n { flex: 1; }
.candidate .c { color: var(--muted); font-size: 12px; }
.merge-pair { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 14px 0 10px; }
.merge-pair figure { margin: 0; text-align: center; width: 150px; }
.merge-pair .avatar { width: 96px; height: 96px; cursor: default; }
.merge-pair figcaption { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.merge-pair figcaption.unnamed { color: var(--muted); font-style: italic; font-weight: 400; }
.merge-pair .s { color: var(--muted); font-size: 12px; }
.merge-pair .arrow { font-size: 26px; color: var(--muted); }
.merge-note { text-align: center; }
.gone-path { font-size: 12px; color: var(--muted); word-break: break-all; }
/* Optimization tab */
.opt { max-width: 900px; padding-top: 16px; }
.opt h2 { font-size: 18px; margin: 0 0 4px; }
.opt .lead { color: var(--muted); margin: 0 0 16px; }
.opt-summary {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 16px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--line); margin-bottom: 18px;
}
.opt-summary .big { font-size: 20px; font-weight: 700; }
.opt-summary .what { flex: 1 1 220px; }
.opt-summary .what small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.opt-summary .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.opt-progress { padding: 18px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
#dupDeleting { margin-bottom: 18px; }
.opt-progress progress { width: 100%; height: 10px; margin-top: 10px; accent-color: var(--accent); }
.dup-group { display: flex; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin-bottom: 10px; }
.dup-group img { width: 76px; height: 76px; border-radius: 8px; object-fit: cover; background: var(--chip); flex: none; }
.dup-group .files { flex: 1; min-width: 0; display: grid; gap: 4px; }
.dup-file { display: flex; gap: 8px; align-items: baseline; font-size: 13px; min-width: 0; }
.dup-file .tag { flex: none; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
.dup-file.keep .tag { background: #e6f4ea; color: #1e7b34; }
.dup-file.remove .tag { background: #fde8e4; color: #b42318; }
.dup-file .p { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.dup-file .when { flex: none; color: var(--muted); font-size: 12px; }
@media (prefers-color-scheme: dark) {
  .dup-file.keep .tag { background: #173d24; color: #8fdca4; }
  .dup-file.remove .tag { background: #4a1d17; color: #f4a99c; }
}
@media (max-width: 639px) { .dup-file .when { display: none; } .dup-group img { width: 56px; height: 56px; } }
.delete-what { display: flex; align-items: center; gap: 12px; margin: 4px 0 12px; }
.delete-what img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; background: var(--chip); flex: none; }
.delete-what .p { font-size: 12px; color: var(--muted); word-break: break-all; }
.delete-options { display: grid; gap: 8px; }
.delete-options button { text-align: left; padding: 10px 12px; }
.delete-options button small { display: block; color: var(--muted); font-weight: 400; margin-top: 2px; }
.btn.danger { border-color: #c2410c; color: #c2410c; }
.btn.danger:hover { background: #c2410c; color: #fff; }
.btn.danger:hover small { color: rgba(255, 255, 255, 0.85); }
#mergeHint { display: flex; align-items: center; gap: 12px; }
#mergeHint img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex: none; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.dlg-actions .btn { padding: 7px 16px; }

main { overflow-y: auto; min-height: 0; padding: 0 16px 40px; overscroll-behavior: contain; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 0 0; min-height: 12px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 999px;
  padding: 3px 4px 3px 10px; font-size: 12px;
}
.chip button { border: 0; background: transparent; color: var(--muted); padding: 0 6px; font-size: 14px; line-height: 1; }
.chip button:hover { color: var(--ink); }
.chip-mode { color: var(--muted); font-size: 12px; align-self: center; }
.clear-all {
  border: 0; background: transparent; color: var(--accent); font-size: 12px; padding: 3px 6px; border-radius: 999px;
}
.clear-all:hover { background: var(--hover); }
.count { color: var(--muted); font-size: 12px; padding: 12px 0 0; }

.group h2 {
  font-size: 15px; font-weight: 650; margin: 0; padding: 18px 0 8px; position: sticky; top: var(--head-h, 0px);
  background: linear-gradient(var(--bg) 75%, transparent); z-index: 2;
}
/* The filters bar (chips, Clear all, count) stays visible while scrolling; group headers
   stick just below it (--head-h is its height, kept current by beginViewLoad). */
.view-head {
  position: sticky; top: 0; z-index: 3; background: var(--bg);
  margin: 0 -16px; padding: 0 16px 8px; border-bottom: 1px solid transparent;
}
.view-head.stuck { border-bottom-color: var(--line); }
.group h2 small { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 12px; }
.group h4 { font-size: 13px; color: var(--muted); font-weight: 500; margin: 10px 0 6px; }
.grid { display: flex; flex-wrap: wrap; gap: var(--gap); }
.grid::after { content: ""; flex-grow: 1000000000; }
.tile {
  position: relative; height: var(--row); flex-grow: calc(var(--r) * 100); width: calc(var(--r) * var(--row));
  background: var(--chip); overflow: hidden; border-radius: 3px; cursor: zoom-in;
}
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile:hover img { filter: brightness(1.06); }
#sentinel { height: 1px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; padding-top: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; }
.card:hover { border-color: var(--muted); }
.card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--chip); }
.card .meta { padding: 8px 10px 10px; }
.card .t { font-weight: 600; }
.card .s { color: var(--muted); font-size: 12px; }

.people-grid { grid-template-columns: repeat(auto-fill, minmax(calc(150px * var(--z, 1)), 1fr)); gap: 14px; }
/* People grid: only the visible cards exist in the page (see mountPeopleGrid). Cards are
   kept while they stay on screen and slide to new places instead of being rebuilt. */
.vgrid { position: relative; margin-top: 16px; }
.vcard { position: absolute; left: 0; top: 0; }
.vgrid.animate .vcard { transition: transform 0.28s cubic-bezier(0.2, 0.7, 0.3, 1); }
.vcard.enter, .vgrid.fade-in { animation: fade-in 0.22s ease both; }
.vcard.leave { animation: fade-out 0.2s ease forwards; pointer-events: none; }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; scale: 0.92; } }
@media (prefers-reduced-motion: reduce) {
  .vgrid.animate .vcard { transition: none; }
  .vcard.enter, .vgrid.fade-in, .vcard.leave { animation-duration: 1ms; }
}
/* People sizes follow --z, the size slider (set on #peopleHost; see peopleLayoutFor) */
.face-card { text-align: center; padding: 14px 10px 10px; cursor: default; height: calc(110px * var(--z, 1) + 112px); }
.face-card .avatar { width: calc(110px * var(--z, 1)); height: calc(110px * var(--z, 1)); }
.avatar {
  width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 8px; overflow: hidden; cursor: pointer;
  background: var(--chip);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 0.2s; }
.avatar img.ok { opacity: 1; }
.face-card input {
  width: 100%; border: 1px solid transparent; background: transparent; text-align: center; border-radius: 6px;
  padding: 3px; font-weight: 600;
}
.face-card input:hover, .face-card input:focus { border-color: var(--line); background: var(--bg); outline: none; }
.face-card input::placeholder { color: var(--muted); font-weight: 400; font-style: italic; }
.face-card .row { display: flex; gap: 4px; justify-content: center; margin-top: 6px; }
.face-card .btn { font-size: 11px; padding: 3px 6px; max-width: 100%; }
.face-card.hidden-person, .face-row.hidden-person { opacity: 0.5; }

/* List layout: compact rows, several columns on wide screens */
.face-row {
  display: flex; align-items: center; gap: calc(8px * var(--z, 1)); height: calc(44px * var(--z, 1)); padding: 0 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
}
.face-row .avatar { width: calc(32px * var(--z, 1)); height: calc(32px * var(--z, 1)); margin: 0; flex: none; }
.face-row input {
  flex: 1; min-width: 0; border: 1px solid transparent; background: transparent; border-radius: 6px;
  padding: 3px 6px; font-weight: 600; font-size: calc(14px + 4px * (var(--z, 1) - 1));
}
.face-row input:hover, .face-row input:focus { border-color: var(--line); background: var(--bg); outline: none; }
.face-row input::placeholder { color: var(--muted); font-weight: 400; font-style: italic; }
.face-row .s { color: var(--muted); font-size: calc(12px + 2px * (var(--z, 1) - 1)); white-space: nowrap; }
.face-row .btn { font-size: calc(11px + 2px * (var(--z, 1) - 1)); padding: 3px 6px; white-space: nowrap; flex: none; }
/* Actions appear on the row under the pointer (or being edited), so rows stay narrow */
@media (hover: hover) {
  .face-row .btn { display: none; }
  .face-row:hover .btn, .face-row:focus-within .btn { display: inline-block; }
  .face-row:hover .s, .face-row:focus-within .s { display: none; }
}
.face-row.skeleton .line { flex: 1; margin: 0; max-width: 60%; }
.people-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(250px + 100px * (var(--z, 1) - 1)), 1fr)); gap: 6px; margin-top: 16px; }
.zoom { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
.zoom .big { font-size: 16px; }
.zoom input { width: 110px; accent-color: var(--accent); }

/* Loading placeholders */
.shimmer, .avatar:has(img:not(.ok)), .candidate .avatar-sm:has(img:not(.ok)), .tile:has(> img:not(.ok)) {
  background: linear-gradient(90deg, var(--chip) 0%, var(--hover) 50%, var(--chip) 100%);
  background-size: 200% 100%; animation: shimmer 1.2s linear infinite;
}
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.skeleton .avatar { cursor: default; }
.skeleton .line { height: 12px; border-radius: 6px; margin: 10px auto 0; width: 70%; }
.skeleton .line.short { width: 40%; }
.spinner {
  width: 26px; height: 26px; border-radius: 50%; margin: 28px auto; border: 3px solid var(--chip);
  border-top-color: var(--accent); animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .shimmer, .avatar, .spinner, .tile { animation-duration: 3s; } }
/* Results that are being replaced, and placeholders while they load */
.view-area { transition: opacity 0.15s; }
.view-area.stale { opacity: 0.45; pointer-events: none; }
.view-area.fade-in { animation: fade-in 0.22s ease both; }
.tile img { opacity: 0; transition: opacity 0.25s; }
.tile img.ok { opacity: 1; }
.tile.skeleton { cursor: default; }
.sk-title { height: 16px; width: 180px; border-radius: 8px; margin: 22px 0 12px; }
.card.skeleton { cursor: default; }
.card.skeleton .sk-img { aspect-ratio: 4 / 3; }
.card.skeleton .line { margin: 4px 0 8px; }

/* Short notices after an action */
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 13px; z-index: 30;
  transition: opacity 0.2s, transform 0.2s; max-width: calc(100vw - 32px);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.error { background: #b42318; color: #fff; }

.upbar { display: flex; align-items: center; gap: 10px; padding-top: 16px; color: var(--muted); }
.upbar .seg { margin: 0; }
.upbar .seg button { white-space: nowrap; padding: 5px 10px; }
.blank { color: var(--muted); padding: 60px 0; text-align: center; }

#viewer {
  position: fixed; inset: 0; background: rgba(8, 8, 8, 0.96); z-index: 20; display: none;
  grid-template-columns: 1fr 300px; color: #eee;
}
#viewer.open { display: grid; }
#viewer .stage { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#viewer .frame { position: relative; }
#viewer .frame img { display: block; object-fit: contain; background: #111; }
/* Zoom: the frame (photo and face boxes) is scaled and moved from its fitted place */
#viewer .frame { z-index: 1; transform-origin: 0 0; cursor: zoom-in; touch-action: none; }
#viewer .frame.animate-zoom { transition: transform 0.25s ease; }
#viewer .frame img.turning { transition: rotate 0.2s ease, width 0.2s ease, height 0.2s ease; }

/* The outline is a shadow, not a border: borders can't be thinner than a pixel before

#viewer .box {
  position: absolute; box-shadow: inset 0 0 0 calc(2px / var(--zs, 1)) rgba(255, 255, 255, 0.85);
  border-radius: calc(4px / var(--zs, 1)); display: none;
}
#viewer.boxes .box { display: block; }
#viewer .box span {
  position: absolute; top: 100%; left: 50%; transform: translateX(-50%) scale(calc(1 / var(--zs, 1))); transform-origin: top center; margin-top: 3px; white-space: nowrap;
  background: rgba(0, 0, 0, 0.7); padding: 1px 6px; border-radius: 4px; font-size: 11px;
}
#viewer .nav {
  position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255, 255, 255, 0.08); border: 0;
  color: #fff; width: 44px; height: 64px; border-radius: 10px; font-size: 22px;
}
#viewer .nav:hover { background: rgba(255, 255, 255, 0.18); }
#viewer .nav[hidden] { display: none; }
#viewer .prev { left: 12px; } #viewer .next { right: 12px; }
#viewer .close { position: absolute; top: 12px; left: 12px; background: transparent; border: 0; color: #fff; font-size: 24px; }
#viewer .trash {
  position: absolute; top: 10px; right: 12px; z-index: 2; width: 40px; height: 40px; border: 0; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.35); color: #eee;
}
#viewer .trash:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }
#viewer .info { background: #161615; border-left: 1px solid #2a2a28; padding: 20px 18px; overflow-y: auto; }
#viewer .info h3 { margin: 0 0 4px; font-size: 16px; }
#viewer .info .s { color: #a5a29b; font-size: 12px; margin-bottom: 14px; word-break: break-all; }
#viewer .info h5 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #8b8880; margin: 16px 0 8px; }
.vface { display: flex; align-items: center; gap: 10px; padding: 5px; border-radius: 8px; }
.vface:hover { background: #242422; }
.vface img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex: none; }
.vface .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.vface .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.vface .n.unnamed { color: #9a968e; font-style: italic; }

.vface .n.editable:hover { background: #2a2a28; color: #ddd; }
.vface input.rename {

}
.vface .acts { display: flex; flex-wrap: wrap; gap: 4px; }
.vface button { white-space: nowrap; background: transparent; border: 1px solid #3a3936; color: #bbb; border-radius: 6px; font-size: 11px; padding: 2px 6px; }
.vface button:hover { color: #fff; border-color: #777; }
.vface button.is-cover { color: #8fdca4; border-color: #2f5a3b; opacity: 1; cursor: default; }
.info a { color: #9dbaff; }
.photo-acts { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 14px; }
.photo-acts button, .photo-acts .btn-like {

  border-radius: 7px; font-size: 12px; padding: 5px 10px;
}

.photo-acts button:hover, .photo-acts .btn-like:hover { color: #fff; border-color: #777; }
.photo-acts button:disabled { opacity: 0.5; }
.info label { display: flex; gap: 8px; align-items: center; color: #bbb; font-size: 12px; margin-top: 16px; }

dialog {
  border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink);
  padding: 0; width: min(620px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}

/* ---- Tablets and narrow windows: dates, grouping and order move into a panel ---------- */

@media (max-width: 639px) {

  /* the people column slides in from the left */
  aside {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 15; width: min(320px, 86vw);
    transform: translateX(-105%); box-shadow: 4px 0 30px rgba(0, 0, 0, 0.2);
    padding: 16px 14px calc(16px + env(safe-area-inset-bottom));
    /* hidden once closed, so it can't be reached with the keyboard or a screen reader */

  }
  body.drawer-open aside { transform: none; visibility: visible; transition: transform 0.22s ease; }
  body.drawer-open .scrim { display: block; }
  body.aside-collapsed aside { padding: 16px 14px; }
  body.aside-collapsed aside > :not(.aside-head), body.aside-collapsed .aside-head h3 { display: revert; }
  body.aside-collapsed .aside-head { flex-direction: row; }
  .rail-count { display: none !important; }
  body.no-aside aside { display: none; }
  .person { padding: 8px 6px; }

  main { padding: 0 12px calc(40px + env(safe-area-inset-bottom)); }
  .view-head { margin: 0 -12px; padding: 0 12px 8px; }

  .cards { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .upbar { flex-wrap: wrap; gap: 8px; }

  .people-bar { flex-wrap: wrap; gap: 8px 10px; }

  .folder { flex-wrap: wrap; }

  #viewer { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  #viewer .info { max-height: 38dvh; border-left: 0; border-top: 1px solid #2a2a28; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }

  #viewer .prev { left: 6px; } #viewer .next { right: 6px; }
  #viewer .close { top: 8px; left: 8px; width: 40px; height: 40px; border-radius: 50%; background: rgba(0, 0, 0, 0.45); }
}
</style>

<body>
<header>
  <div class="brand">totufoto</div>
  <nav id="tabs">

    <label class="sort-label"><span class="compact-only">Order</span>
      <select id="sort" title="Sort by capture date">
        <option value="desc">Newest first</option>
        <option value="asc">Oldest first</option>
      </select>
    </label>
  </div>
  <div class="head-buttons">
    <button class="icon-btn" id="peopleBtn" title="People in the photo" aria-label="People in the photo" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="badge" id="peopleBtnCount" hidden></span></button>
    <button class="icon-btn" id="viewBtn" title="Dates, grouping and order" aria-label="Dates, grouping and order" aria-expanded="false" aria-controls="tools"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M2 14h4"/><path d="M10 8h4"/><path d="M18 16h4"/></svg><span class="dot" id="viewBtnDot" hidden></span></button>

  </div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const regionName = (() => {
  try { const d = new Intl.DisplayNames([navigator.language], { type: "region" }); return cc => { try { return d.of(cc); } catch { return cc; } }; }
  catch { return cc => cc; }
})();
const MONTHS = Array.from({ length: 12 }, (_, i) => new Date(2000, i, 1).toLocaleString(undefined, { month: "long" }));
const fmtDay = t => new Date(+t.slice(0, 4), +t.slice(5, 7) - 1, +t.slice(8, 10))
  .toLocaleDateString(undefined, { weekday: "short", year: "numeric", month: "long", day: "numeric" });
const fmtFull = t => fmtDay(t) + " · " + t.slice(11, 16);

const state = {
  view: "photos", sort: "desc", groupBy: "month", match: "all",
  people: new Set(), place: null, date: null, upcoming: 30,
  from: null, to: null, // capture date range, YYYY-MM-DD, both included
};
let people = [], places = [], placeById = new Map(), photos = [], viewerIndex = -1, renderToken = 0;

// ---- URL state -------------------------------------------------------------
function saveHash() {
  const p = new URLSearchParams();
  if (state.view !== "photos") p.set("view", state.view);
  if (state.sort !== "desc") p.set("sort", state.sort);
  if (state.groupBy !== "month") p.set("group", state.groupBy);
  if (state.match !== "all") p.set("match", state.match);
  if (state.people.size) p.set("people", [...state.people].join(","));
  if (state.place != null) p.set("place", state.place);
  if (state.date) p.set("date", state.date);
  if (state.upcoming !== 30) p.set("days", state.upcoming);
  if (state.from) p.set("from", state.from);
  if (state.to) p.set("to", state.to);
  history.replaceState(null, "", "#" + p.toString());
}
function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  state.view = p.get("view") || "photos";
  // The Places tab became "Photos, grouped by place": old links still work.
  const oldPlaces = state.view === "places";
  if (oldPlaces) state.view = "photos";
  state.sort = p.get("sort") || "desc";
  state.groupBy = oldPlaces ? "place" : p.get("group") || "month";
  state.match = p.get("match") || "all";
  state.people = new Set((p.get("people") || "").split(",").filter(Boolean).map(Number));
  state.place = p.get("place") != null && p.get("place") !== "" ? Number(p.get("place")) : null;
  state.date = p.get("date");
  state.upcoming = Number(p.get("days") || 30);
  const day = v => (/^\d{4}-\d{2}-\d{2}$/.test(v || "") ? v : null);
  state.from = day(p.get("from"));
  state.to = day(p.get("to"));
}

// ---- data ------------------------------------------------------------------
const api = async (url, opts) => {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(await r.text());

const LOADING_DELAY = 150;

 * Prepares `main` as a head (filters, counts) and an area (results) for `view`. The head is

  headObserver.observe(head);

/** Renders groups progressively so huge libraries stay responsive. */
function renderGroups(container, groups, headerFn, subFn) {
  const token = renderToken;
  const sentinel = document.createElement("div");
  sentinel.id = "sentinel";
  container.append(sentinel);
  let gi = 0, ii = 0, currentGrid = null, currentSub = null;
  const BATCH = 400;
  function pump() {
    if (token !== renderToken) return observer.disconnect();
    let budget = BATCH, html = "";
    const frag = document.createDocumentFragment();
    while (budget > 0 && gi < groups.length) {
      const g = groups[gi];
      if (ii === 0) {
        const sec = document.createElement("section");
        sec.className = "group";
        if (headerFn) sec.innerHTML = headerFn(g);
        frag.append(sec);
        currentGrid = null; currentSub = sec;
      }
      const sub = subFn ? subFn(g.items[ii], ii ? g.items[ii - 1] : null) : null;
      if (sub || !currentGrid) {
        if (sub) currentSub.insertAdjacentHTML("beforeend", `<h4>${sub}</h4>`);
        currentGrid = document.createElement("div");
        currentGrid.className = "grid";
        currentSub.append(currentGrid);
      }
      html = "";
      let end = ii;
      while (end < g.items.length && budget > 0) {
        if (end > ii && subFn && subFn(g.items[end], g.items[end - 1])) break;
        html += tile(g.items[end]); end++; budget--;
      }
      currentGrid.insertAdjacentHTML("beforeend", html);
      ii = end;
      if (ii >= g.items.length) { gi++; ii = 0; }
    }
    container.insertBefore(frag, sentinel);
    if (gi >= groups.length) { observer.disconnect(); sentinel.remove(); }
  }
  const observer = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) pump(); }, { root: $("#main"), rootMargin: "1500px" });
  pump();
  observer.observe(sentinel);
}

  container.append(grid);
  // Cards are added in batches as you scroll; enough are added at once to reach a scroll
  // position being restored.
  const back = cardsReturn?.key === cardsViewKey() ? cardsReturn.scroll : 0;
  cardsReturn = null;
  const main = $("#main"), BATCH = 120, token = renderToken;
  let next = 0;
  const sentinel = document.createElement("div");
  container.append(sentinel);
  const pump = () => {
    if (token !== renderToken) return observer.disconnect();
    grid.insertAdjacentHTML("beforeend", groups.slice(next, next + BATCH).map(card).join(""));
    next += BATCH;
    if (next >= groups.length) { observer.disconnect(); sentinel.remove(); }
  };
  const observer = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) pump(); }, { root: main, rootMargin: "1200px" });
  pump();
  while (next < groups.length && main.scrollHeight < back + main.clientHeight * 2) pump();
  if (back) main.scrollTop = back;
  if (next < groups.length) observer.observe(sentinel);
}

async function renderUpcoming(main, token, signal) {
  const opts = [7, 14, 30, 60, 90].map(d => `<button data-d="${d}" class="${d === state.upcoming ? "on" : ""}">${d} days</button>`).join("");
  const load = beginViewLoad(main, "upcoming",
    `<div class="upbar">Memories from past years for the next <div class="seg" id="days">${opts}</div></div>` + filterChips(),
    photoPlaceholders, token);
  $("#days").addEventListener("click", e => { if (e.target.dataset.d) { state.upcoming = +e.target.dataset.d; render(); } });
  const data = await api(photoQuery({ upcoming: state.upcoming }), { signal });
  if (token !== renderToken) return;
  load.finish();
  const order = new Map(data.days.map((d, i) => [d, i]));
  // Upcoming days first (today, tomorrow...), and within a day the most recent year first.
  photos = data.photos.slice().sort((a, b) =>
    order.get(a[3].slice(5, 10)) - order.get(b[3].slice(5, 10)) || b[3].localeCompare(a[3]));
  if (!photos.length) { load.area.innerHTML = `<div class="blank">No photos were taken on these dates in previous years.</div>`; return; }
  const thisYear = new Date().getFullYear();
  const groups = groupPhotos(photos, p => p[3].slice(5, 10));
  const header = g => {
    const idx = order.get(g.key);
    const [m, d] = g.key.split("-").map(Number);
    const label = new Date(thisYear, m - 1, d).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    const when = idx === 0 ? "Today" : idx === 1 ? "Tomorrow" : `In ${idx} days`;
    return `<h2>${when} · ${esc(label)}<small>${g.items.length}</small></h2>`;
  };
  const sub = (p, prev) => {
    if (prev && prev[3].slice(0, 4) === p[3].slice(0, 4)) return null;
    const y = +p[3].slice(0, 4), ago = thisYear - y;
    return `${ago} year${ago === 1 ? "" : "s"} ago · ${y}`;
  };
  renderGroups(load.area, groups, header, sub);
}

// ---- optimization: identical files ------------------------------------------------------
const fmtBytes = n => n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(0)} KB`
  : n < 1073741824 ? `${(n / 1048576).toFixed(1)} MB` : `${(n / 1073741824).toFixed(2)} GB`;
const fmtFileDate = secs => new Date(secs * 1000).toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
const DUP_BATCH = 100;
async function renderOptimization(main, token, signal) {
  const report = await api("/api/duplicates", { signal });
  if (token !== renderToken) return;
  const intro = `<h2>Duplicate photos</h2><p class="lead">Identical files (the very same bytes) take space twice. Of each set, the copy with the oldest file date is kept. Nothing is deleted until you click <b>Delete duplicates</b>.</p>`;
  if (report.deleting) {
    // Deleting (started here or on another device): progress until it ends.
    main.innerHTML = `<div class="opt">${intro}<div class="opt-progress" id="dupDeleting">${deleteProgressHtml(null)}</div></div>`;
    const timer = setInterval(async () => {
      if (token !== renderToken || state.view !== "optimization") return clearInterval(timer);
      const p = await api("/api/duplicates/progress").catch(() => null);
      if (!p || token !== renderToken) return;
      if (!p.deleting) { clearInterval(timer); loadMeta().catch(() => {}); return render(); }
      const box = $("#dupDeleting");
      if (box) box.innerHTML = deleteProgressHtml(p);
    }, 500);
    return;
  }
  if (report.scanning || report.running) {
    // While the scan or the search runs: progress, refreshed every second.
    const what = report.scanning ? "Waiting for the photo scan to finish…"
      : `Checking ${report.done.toLocaleString()} of ${report.total.toLocaleString()} files that could be duplicates`;
    main.innerHTML = `<div class="opt">${intro}<div class="opt-progress"><div>${what}</div>
      <progress ${report.scanning || !report.total ? "" : `max="${report.total}" value="${report.done}"`}></progress></div></div>`;
    setTimeout(() => { if (token === renderToken && state.view === "optimization") renderOptimization(main, token, signal).catch(() => {}); }, 1000);
    return;
  }
  const checked = report.finished ? `Last checked ${esc(report.finished)}.` : "Not checked yet.";
  const summary = report.files
    ? `<div class="what"><div class="big">${fmtBytes(report.bytes)} can be freed</div>
        <small>${report.files.toLocaleString()} duplicate file${report.files === 1 ? "" : "s"} in ${report.groups.length.toLocaleString()} set${report.groups.length === 1 ? "" : "s"}. ${checked}</small></div>
       <div class="acts"><button class="btn" data-dup-search>Search again</button>
         <button class="btn danger" data-dup-delete>Delete duplicates</button></div>`
    : `<div class="what"><div class="big">No duplicates</div><small>No two photos are identical files. ${checked}</small></div>
       <div class="acts"><button class="btn" data-dup-search>Search again</button></div>`;
  main.innerHTML = `<div class="opt">${intro}<div class="opt-summary">${summary}</div><div id="dupGroups"></div></div>`;
  const list = $("#dupGroups");
  const file = (f, kind) => `<div class="dup-file ${kind}">${kind === "keep"
    ? `<span class="tag" title="The oldest copy: it stays where it is">Keep</span>`
    : `<span class="tag" title="Moved to the bin only when you click Delete duplicates">To delete</span>`}
      <span class="p" title="${esc(f.path)}"><bdi>${esc(f.path)}</bdi></span><span class="when">${fmtFileDate(f.mtime)}</span></div>`;
  let shown = 0;
  const more = () => {
    list.querySelector(".dup-more")?.remove();
    list.insertAdjacentHTML("beforeend", report.groups.slice(shown, shown + DUP_BATCH).map(g => `
      <div class="dup-group"><img src="/thumb/${g.keep.id}" loading="lazy" alt="">
        <div class="files">${file(g.keep, "keep")}${g.remove.map(f => file(f, "remove")).join("")}</div></div>`).join(""));
    shown += DUP_BATCH;
    if (shown < report.groups.length)
      list.insertAdjacentHTML("beforeend", `<button class="btn dup-more">Show ${Math.min(DUP_BATCH, report.groups.length - shown)} more</button>`);
  };
  more();
  list.addEventListener("click", e => { if (e.target.classList.contains("dup-more")) more(); });
  main.querySelector("[data-dup-search]")?.addEventListener("click", async e => {
    e.target.disabled = true;
    await post("/api/duplicates/search").catch(() => {});
    setTimeout(render, 300);
  });
  main.querySelector("[data-dup-delete]")?.addEventListener("click", () => deleteDuplicates(report));
}
/** Progress of a deletion: files done of total and space freed so far (null: starting). */
function deleteProgressHtml(p) {
  const what = !p || !p.total ? "Deleting the duplicates…"
    : p.done < p.total ? `Deleting ${p.done.toLocaleString()} of ${p.total.toLocaleString()} duplicate files · ${fmtBytes(p.freed)} freed`
    : `Updating the gallery · ${fmtBytes(p.freed)} freed`;
  return `<div>${what}</div><progress ${p?.total ? `max="${p.total}" value="${p.done}"` : ""}></progress>`;
}
async function deleteDuplicates(report) {
  const choice = await askDelete(`<p>Move <b>${report.files.toLocaleString()} duplicate file${report.files === 1 ? "" : "s"}</b> (${fmtBytes(report.bytes)}) to the bin of the computer running Totufoto?</p>
    <p>Of each set of identical files, the one with the oldest file date is kept. A file that changed since the search is left alone.</p>
    <div class="dlg-actions"><button class="btn" data-choice="cancel">Cancel</button><button class="btn danger" data-choice="bin">Move to the bin</button></div>`,
    "Delete duplicates?");
  if (choice !== "bin") return;
  const run = body => fetch("/api/duplicates/delete", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
    .then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); });
  // The summary becomes a progress bar while the server works through the files.
  const summary = $(".opt-summary");
  const box = document.createElement("div");
  box.className = "opt-progress";
  box.id = "dupDeleting";
  box.innerHTML = deleteProgressHtml(null);
  summary?.replaceWith(box);
  const runWithProgress = async body => {
    let polling = true;
    box.innerHTML = deleteProgressHtml(null);
    (async () => {
      while (polling) {
        await new Promise(r => setTimeout(r, 400));
        const p = await api("/api/duplicates/progress").catch(() => null);
        if (polling && p?.deleting) box.innerHTML = deleteProgressHtml(p);
      }
    })();
    try { return await run(body); } finally { polling = false; }
  };
  try {
    let result = await runWithProgress({});
    let freed = result.freed, binned = result.binned, deleted = result.deleted;
    if (result.no_bin.length) {
      const again = await askDelete(`<p>${result.no_bin.length.toLocaleString()} file${result.no_bin.length === 1 ? "" : "s"} can't be moved to a bin on ${result.no_bin.length === 1 ? "its drive" : "their drive"}, so they can't be recovered once deleted. Their oldest copy is kept either way.</p>
        <div class="dlg-actions"><button class="btn" data-choice="cancel">Keep them</button><button class="btn danger" data-choice="permanently">Delete permanently</button></div>`,
        "Delete them permanently?");
      if (again === "permanently") {
        const r2 = await runWithProgress({ ids: result.no_bin, permanently: true });
        freed += r2.freed; deleted += r2.deleted;
        result.skipped.push(...r2.skipped);
      }
    }
    const parts = [binned && `${binned.toLocaleString()} moved to the bin`, deleted && `${deleted.toLocaleString()} deleted`].filter(Boolean).join(", ");
    toast(`${fmtBytes(freed)} freed${parts ? `: ${parts}` : ""}${result.skipped.length ? `. ${result.skipped.length} left alone (changed since the search)` : ""}`);
  } catch (err) {
    toast(`Couldn't delete the duplicates: ${err.message}`, true);
  }
  loadMeta().catch(() => {});
  render();
}

// ---- people grid ---------------------------------------------------------------------
// Libraries can have tens of thousands of people, so only the cards on screen exist in the
// page. Everything else (opening dialogs, merging, searching) stays cheap because of that.
const CARD_MIN_W = 150, GRID_GAP = 14, OVERSCAN_ROWS = 2;
let peopleGrid = null, peopleQuery = "";

// Faces fade in the first time they load; after that they show at once.
const loadedFaces = new Set();
function faceLoaded(img) { loadedFaces.add(img.dataset.face); img.classList.add("ok"); }
const faceImg = id => loadedFaces.has(String(id))
  ? `<img src="/face/${id}" alt="" data-face="${id}" class="ok">`
  : `<img src="/face/${id}" alt="" data-face="${id}" decoding="async" onload="faceLoaded(this)" onerror="faceLoaded(this)">`;
const faceCard = p => `
  <div class="card face-card ${p.hidden ? "hidden-person" : ""}" data-person="${p.id}">
    <div class="avatar" title="Show photos">${faceImg(p.face)}</div>
    <input value="${esc(p.name || "")}" placeholder="Add a name" data-rename="${p.id}">
    <div class="s">${p.count} photo${p.count === 1 ? "" : "s"}</div>
    <div class="row">
      <button class="btn" data-merge="${p.id}" title="Merge with another person">Same as…</button>
      <button class="btn" data-hide="${p.id}">${p.hidden ? "Show" : "Hide"}</button>
    </div>
  </div>`;
const skeletonCard = () => `
  <div class="card face-card skeleton" aria-hidden="true">
    <div class="avatar shimmer"></div><div class="line shimmer"></div><div class="line short shimmer"></div>
  </div>`;
const faceRow = p => `
  <div class="face-row ${p.hidden ? "hidden-person" : ""}" data-person="${p.id}">
    <div class="avatar" title="Show photos">${faceImg(p.face)}</div>
    <input value="${esc(p.name || "")}" placeholder="Add a name" data-rename="${p.id}">
    <span class="s">${p.count} photo${p.count === 1 ? "" : "s"}</span>
    <button class="btn" data-merge="${p.id}" title="Merge with another person">Same as…</button>
    <button class="btn" data-hide="${p.id}">${p.hidden ? "Show" : "Hide"}</button>
  </div>`;
const skeletonRow = () => `
  <div class="face-row skeleton" aria-hidden="true"><div class="avatar shimmer"></div><div class="line shimmer"></div></div>`;
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));

// Cards show big faces; the list fits several times more people on screen.
// The size slider scales both layouts. Cards stop at 1.6x: face pictures are 128 px, so
// bigger avatars would look blurry.
const PEOPLE_ZOOM = { cards: { min: 0.8, max: 1.6, step: 0.1 }, list: { min: 1, max: 3, step: 0.25 } };
const peopleZoom = { cards: 1, list: 1 };
let peopleLayout = "cards";
try {
  if (localStorage.getItem("totufoto.peopleLayout") === "list") peopleLayout = "list";
  const saved = JSON.parse(localStorage.getItem("totufoto.peopleZoom") || "{}");
  for (const [k, r] of Object.entries(PEOPLE_ZOOM))
    if (typeof saved[k] === "number") peopleZoom[k] = Math.min(r.max, Math.max(r.min, saved[k]));
} catch {}
/** Grid geometry for a layout at its current size; must match the CSS above. */
function peopleLayoutFor(name) {
  const z = peopleZoom[name];
  return name === "list"
    // Rows get taller faster than wider, so bigger sizes still show several columns.
    ? { minW: Math.round(250 + 100 * (z - 1)), h: Math.round(44 * z), gap: 6, item: faceRow,
        skeleton: () => `<div class="people-list">${skeletonRow().repeat(24)}</div>` }
    : { minW: Math.round(CARD_MIN_W * z), h: Math.round(110 * z) + 112, gap: GRID_GAP, item: faceCard,
        skeleton: () => `<div class="cards people-grid">${skeletonCard().repeat(18)}</div>` };
}

function mountPeopleGrid(host, { fadeIn = false, layout: L = peopleLayoutFor("cards") } = {}) {
  const main = $("#main");
  host.innerHTML = `<div class="vgrid${fadeIn ? " fade-in" : ""}"></div>`;
  const outer = host.firstElementChild;
  const rowH = L.h + L.gap;
  const overscan = Math.max(OVERSCAN_ROWS, Math.ceil(400 / rowH)); // about 400 px above and below
  const cards = new Map(); // person id -> .vcard element
  const grid = { items: [], cols: 1, cardW: L.minW };
  let animateTimer = 0;
  const pos = i => `translate(${(i % grid.cols) * (grid.cardW + L.gap)}px, ${Math.floor(i / grid.cols) * rowH}px)`;

  function layout() {
    const w = outer.clientWidth;
    grid.cols = Math.max(1, Math.floor((w + L.gap) / (L.minW + L.gap)));
    grid.cardW = (w - L.gap * (grid.cols - 1)) / grid.cols;
    outer.style.height = `${Math.max(0, Math.ceil(grid.items.length / grid.cols) * rowH - L.gap)}px`;
  }
  /** Updates a card's contents in place (no rebuild, so pictures and typing are kept). */
  function update(el, p) {
    const card = el.firstElementChild;
    card.classList.toggle("hidden-person", !!p.hidden);
    const input = card.querySelector("input");
    if (document.activeElement !== input && input.value !== (p.name || "")) input.value = p.name || "";
    card.querySelector(".s").textContent = `${p.count} photo${p.count === 1 ? "" : "s"}`;
    card.querySelector("[data-hide]").textContent = p.hidden ? "Show" : "Hide";
    if (card.querySelector("img").dataset.face !== String(p.face)) card.querySelector(".avatar").innerHTML = faceImg(p.face);
  }
  // `animate`: true slides cards to their new places; false (a re-sort, a search) moves them
  // at once, cutting short a slide still running; unset (scrolling) leaves things as they are.
  function draw({ animate } = {}) {
    if (animate) {
      outer.classList.add("animate");
      clearTimeout(animateTimer);
      animateTimer = setTimeout(() => outer.classList.remove("animate"), 350);
    } else if (animate === false) {
      clearTimeout(animateTimer);
      outer.classList.remove("animate");
    }
    const top = outer.getBoundingClientRect().top - main.getBoundingClientRect().top;
    const firstRow = Math.max(0, Math.floor(-top / rowH) - overscan);
    const lastRow = Math.ceil((main.clientHeight - top) / rowH) + overscan;
    const first = firstRow * grid.cols, last = Math.min(grid.items.length, lastRow * grid.cols);
    const keep = new Set();
    for (let i = first; i < last; i++) {
      const p = grid.items[i];
      keep.add(p.id);
      let el = cards.get(p.id);
      if (!el) {
        el = document.createElement("div");
        el.className = animate ? "vcard enter" : "vcard";
        el.innerHTML = L.item(p);
        el.style.transform = pos(i);
        el.style.width = `${grid.cardW}px`;
        outer.append(el);
        cards.set(p.id, el);
        continue;
      }
      update(el, p);
      const t = pos(i);
      if (el.style.transform !== t) el.style.transform = t;
      el.style.width = `${grid.cardW}px`;
    }
    const alive = new Set(grid.items.map(p => p.id));
    for (const [id, el] of cards) {
      if (keep.has(id)) continue;
      // Keep a card someone is typing in while it's still a person, even off screen.
      if (el.contains(document.activeElement) && alive.has(id)) continue;
      cards.delete(id);
      if (animate && !alive.has(id)) { el.classList.add("leave"); setTimeout(() => el.remove(), 220); }
      else el.remove();
    }
  }
  let raf = 0;
  const onScroll = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); };
  main.addEventListener("scroll", onScroll, { passive: true });
  const resize = new ResizeObserver(() => { layout(); draw(); });
  resize.observe(outer);
  grid.setItems = (next, opts) => { grid.items = next; layout(); draw(opts); };
  /** Index of the first person on screen, to come back to after a size or layout change. */
  grid.firstVisible = () => {
    const top = outer.getBoundingClientRect().top - main.getBoundingClientRect().top;
    return Math.max(0, Math.floor(-top / rowH)) * grid.cols;
  };
  grid.scrollToIndex = i => {
    const top = outer.getBoundingClientRect().top - main.getBoundingClientRect().top;
    if (i > 0) main.scrollTop += top + Math.floor(i / grid.cols) * rowH;
    draw();
  };
  grid.destroy = () => { main.removeEventListener("scroll", onScroll); resize.disconnect(); clearTimeout(animateTimer); };
  return grid;
}

function peopleCountText(n) {
  return peopleQuery ? `${n.toLocaleString()} matching` : `${n.toLocaleString()} people`;
}
/** Redraws everything that shows people from the in-memory list (cheap). `animate` makes
 *  cards slide to their new places, for changes like a merge. */
function refreshPeopleViews({ animate = true } = {}) {
  renderPeopleList();
  if (!peopleGrid) return;
  const items = matchPeople(peopleQuery);
  peopleGrid.setItems(items, { animate });
  $("#peopleCount").textContent = peopleCountText(items.length);
}

const SKELETON_DELAY = 150;
async function renderPeople(main, token) {
  main.innerHTML = `<div class="people-bar">
      <input class="search" id="peopleSearch" type="search" placeholder="Search people" autocomplete="off" value="${esc(peopleQuery)}">
      <span id="peopleCount"></span>
      <select id="peopleSort" title="Sort people" aria-label="Sort people">
        <option value="count" ${peopleSort === "count" ? "selected" : ""}>Most photos</option>
        <option value="name" ${peopleSort === "name" ? "selected" : ""}>Name</option>
      </select>
      <label class="zoom" title="Size"><span aria-hidden="true">A</span>
        <input type="range" id="peopleZoom" aria-label="Size"><span class="big" aria-hidden="true">A</span></label>
      <div class="seg" id="peopleLayout" role="group" aria-label="Layout">
        <button data-layout="cards" class="${peopleLayout === "cards" ? "on" : ""}" title="Big pictures">Cards</button>
        <button data-layout="list" class="${peopleLayout === "list" ? "on" : ""}" title="More people on screen">List</button>
      </div>
    </div>
    <div id="peopleHost"></div>`;
  const host = $("#peopleHost");
  const zoom = $("#peopleZoom");
  const syncZoom = () => {
    Object.assign(zoom, PEOPLE_ZOOM[peopleLayout]);
    zoom.value = peopleZoom[peopleLayout];
    host.style.setProperty("--z", peopleZoom[peopleLayout]);
  };
  // Rebuilds the grid for the current layout and size, keeping the same people on screen.
  const remount = () => {
    if (!peopleGrid) return;
    const anchor = peopleGrid.firstVisible();
    peopleGrid.destroy();
    peopleGrid = mountPeopleGrid(host, { layout: peopleLayoutFor(peopleLayout) });
    refreshPeopleViews({ animate: false });
    peopleGrid.scrollToIndex(anchor);
  };
  syncZoom();
  let zoomFrame = 0;
  zoom.addEventListener("input", () => {
    peopleZoom[peopleLayout] = +zoom.value;
    host.style.setProperty("--z", zoom.value);
    try { localStorage.setItem("totufoto.peopleZoom", JSON.stringify(peopleZoom)); } catch {}
    cancelAnimationFrame(zoomFrame);
    zoomFrame = requestAnimationFrame(remount);
  });
  $("#peopleLayout").addEventListener("click", e => {
    const next = e.target.dataset.layout;
    if (!next || next === peopleLayout) return;
    peopleLayout = next;
    try { localStorage.setItem("totufoto.peopleLayout", next); } catch {}
    for (const b of $("#peopleLayout").children) b.classList.toggle("on", b.dataset.layout === next);
    syncZoom();
    remount();
  });
  $("#peopleSort").addEventListener("change", e => {
    peopleSort = e.target.value;
    try { localStorage.setItem("totufoto.peopleSort", peopleSort); } catch {}
    resetPeopleOrder();
    main.scrollTop = 0;
    refreshPeopleViews({ animate: false });
  });
  $("#peopleSearch").addEventListener("input", e => {
    peopleQuery = e.target.value;
    main.scrollTop = 0;
    refreshPeopleViews({ animate: false });
  });
  let placeholders = false;
  const show = () => {
    if (token !== renderToken) return;
    if (!people.length) { host.innerHTML = `<div class="blank">No faces found yet.</div>`; $("#peopleCount").textContent = ""; return; }
    if (!peopleGrid) {
      resetPeopleOrder(); // opening the tab is when the list gets sorted again
      peopleGrid = mountPeopleGrid(host, { fadeIn: placeholders, layout: peopleLayoutFor(peopleLayout) });
    }
    refreshPeopleViews({ animate: false });
  };
  // What we already have shows at once. Placeholders only appear if loading is slow.
  if (people.length) show();
  else {
    $("#peopleCount").textContent = "Loading people…";
    setTimeout(() => {
      if (token === renderToken && !peopleGrid && !people.length) {
        placeholders = true;
        host.innerHTML = peopleLayoutFor(peopleLayout).skeleton();
      }
    }, SKELETON_DELAY);
  }
  await loadMeta();
  if (token !== renderToken) return;
  if (peopleGrid) refreshPeopleViews({ animate: true }); // fresh counts, in place
  else show();
}

// ---- merge dialog ------------------------------------------------------------------
// The same picker serves two purposes: merging a whole person into another ("Same as" in

let mergeFrom = null, assignFace = null;
const MERGE_LIMIT = 40;
function openPicker() {
  $("#mergeFilter").value = "";
  showMergeStep(null);

  $("#mergeDlg").showModal();
  $("#mergeFilter").focus();
  const opened = { mergeFrom, assignFace };
  nextFrame().then(() => {
    if (mergeFrom === opened.mergeFrom && assignFace === opened.assignFace && $("#mergeDlg").open) renderMergeCandidates();
  });
