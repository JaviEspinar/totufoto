<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imadive</title>
<link rel="stylesheet" href="/app.css?v={{assets}}">
</head>
<body>
<!-- Icons, used as <svg class="icon"><use href="#i-name"/></svg> (icon() in js/core.js) -->
<svg aria-hidden="true" style="display: none">
  <symbol id="i-people" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M2 14h4"/><path d="M10 8h4"/><path d="M18 16h4"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-panel-hide" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></symbol>
  <symbol id="i-panel-show" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></symbol>
  <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M3 4v6h6"/><path d="M3.5 15a9 9 0 1 0 2.1-9.4L3 10"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
</svg>
<header>
  <div class="brand">imadive</div>
  <nav id="tabs">
    <button data-view="photos" class="on">Photos</button>
    <button data-view="upcoming">Upcoming</button>
    <button data-view="people">People</button>
    <button data-view="optimization">Optimization</button>
  </nav>
  <div class="spacer"></div>
  <div class="tools" id="tools">
    <div class="range" title="Only photos taken between these dates (both included)">
      <label>From <input type="date" id="fromDate"></label>
      <label>to <input type="date" id="toDate"></label>
    </div>
    <label>Group
      <select id="groupBy">
        <option value="month">by month</option>
        <option value="day">by day</option>
        <option value="year">by year</option>
        <option value="place">by place</option>
        <option value="none">no groups</option>
      </select>
    </label>
    <label class="sort-label"><span class="compact-only">Order</span>
      <select id="sort" title="Sort by capture date">
        <option value="desc">Newest first</option>
        <option value="asc">Oldest first</option>
      </select>
    </label>
  </div>
  <div class="head-buttons">
    <button class="icon-btn" id="peopleBtn" title="People in the photo" aria-label="People in the photo" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><use href="#i-people"/></svg><span class="badge" id="peopleBtnCount" hidden></span></button>
    <button class="icon-btn" id="viewBtn" title="Dates, grouping and order" aria-label="Dates, grouping and order" aria-expanded="false" aria-controls="tools"><svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><use href="#i-sliders"/></svg><span class="dot" id="viewBtnDot" hidden></span></button>
    <button class="icon-btn" id="settingsBtn" title="Settings: photo folders and indexing" aria-label="Settings"><svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><use href="#i-gear"/></svg></button>
  </div>
</header>
<div class="scrim" id="scrim"></div>

<aside>
  <div class="aside-head">
    <h3>People in the photo</h3>
    <button class="icon-btn small" id="asideToggle" aria-expanded="true" title="Hide this column">
      <span class="when-open"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><use href="#i-panel-hide"/></svg></span><span class="when-closed"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><use href="#i-panel-show"/></svg></span>
    </button>
    <span class="rail-count" id="railCount" hidden></span>
  </div>
  <div class="seg" id="match" title="How to combine the selected people">
    <button data-m="all" class="on" title="Photos where all selected people appear together">Together</button>
    <button data-m="any" title="Photos with at least one of the selected people">Any</button>
    <button data-m="only" title="Photos with exactly the selected people and nobody else you know">Only them</button>
  </div>
  <input class="search" id="peopleFilter" type="search" placeholder="Search people" autocomplete="off">
  <div id="peopleList"></div>
</aside>

<main id="main"></main>

<div id="toast" role="status" aria-live="polite"></div>
<div id="indexPill" role="status" aria-live="polite" hidden>
  <div class="t"><b></b><small></small></div>
  <progress></progress>
  <div class="acts">
    <button class="btn" data-pill-hide title="Hide until the next scan">Hide</button>
    <button class="btn" data-pill-new hidden></button>
    <button class="btn" data-pill-details>Details</button>
  </div>
</div>

<dialog id="nameDlg" aria-labelledby="nameTitle">
  <div class="dlg-head"><h3 id="nameTitle"></h3><button data-choice="cancel" title="Cancel">✕</button></div>
  <div class="dlg-body">
    <div class="merge-pair" id="namePair"></div>
    <p class="merge-note" id="nameNote"></p>
    <div class="dlg-actions">
      <button class="btn" data-choice="cancel">Cancel</button>
      <button class="btn" data-choice="keep" id="nameKeep">Keep separate</button>
      <button class="btn primary" data-choice="merge">Merge them</button>
    </div>
  </div>
</dialog>

<dialog id="choiceDlg" aria-labelledby="choiceTitle">
  <div class="dlg-head"><h3 id="choiceTitle"></h3><button data-choice="cancel" title="Cancel">✕</button></div>
  <div class="dlg-body"></div>
</dialog>

<dialog id="goneDlg" aria-labelledby="goneTitle">
  <div class="dlg-head"><h3 id="goneTitle"></h3></div>
  <div class="dlg-body">
    <p id="goneText"></p>
    <p class="gone-path" id="gonePath"></p>
    <div class="dlg-actions"><button class="btn primary" data-close>OK</button></div>
  </div>
</dialog>

<dialog id="mergeDlg" aria-labelledby="mergeTitle">
  <div class="dlg-head"><h3 id="mergeTitle">Same person as…</h3><button data-close title="Close">✕</button></div>
  <div class="dlg-body">
    <div id="mergePick">
      <p id="mergeHint"></p>
      <input class="search" id="mergeFilter" type="search" placeholder="Search people" autocomplete="off">
      <div class="candidates"></div>
    </div>
    <div id="mergeConfirm" hidden></div>
  </div>
</dialog>

<dialog id="browseDlg" aria-labelledby="browseTitle">
  <div class="dlg-head"><h3 id="browseTitle">Add a photo folder</h3><button data-close title="Close">✕</button></div>
  <div class="dlg-body">
    <p>Folders on the computer running Imadive. Open a folder, then add it; its subfolders are included.</p>
    <div class="browse-path">
      <button class="btn" data-up title="Folder above" aria-label="Folder above">↑</button>
      <input id="browsePath" spellcheck="false" autocomplete="off" aria-label="Folder path" title="Type or paste a path and press Enter">
    </div>
    <div class="browse-list"></div>
    <div class="err"></div>
    <div class="dlg-actions"><button class="btn" data-close>Cancel</button><button class="btn primary" data-add-here>Add this folder</button></div>
  </div>
</dialog>

<dialog id="settingsDlg" aria-labelledby="settingsTitle">
  <div class="dlg-head"><h3 id="settingsTitle">Settings</h3><button data-close title="Close">✕</button></div>
  <div class="dlg-body"></div>
</dialog>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Photo">
  <div class="stage">
    <button class="close" title="Close (Esc)" aria-label="Close">✕</button>
    <button class="trash" title="Delete this photo (Delete key)" aria-label="Delete this photo"><svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><use href="#i-trash"/></svg></button>
    <button class="nav prev" title="Previous (←)">‹</button>
    <div class="frame"><img alt=""><div class="boxes"></div></div>
    <button class="nav next" title="Next (→)">›</button>
  </div>
  <div class="info">
    <button class="icon-btn small info-toggle" id="infoToggle" aria-expanded="true" title="Hide the details (I)">
      <span class="when-open"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><use href="#i-panel-hide" transform="matrix(-1 0 0 1 24 0)"/></svg></span><span class="when-closed"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><use href="#i-panel-show" transform="matrix(-1 0 0 1 24 0)"/></svg></span>
    </button>
    <div class="info-body"></div>
  </div>
</div>

{{scripts}}
</body>
</html>
