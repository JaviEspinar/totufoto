<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Totufoto</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1c1b19; --muted: #6d6a64; --line: #e4e1da;
  --accent: #2f6fdf; --accent-ink: #ffffff; --chip: #eceae4; --hover: #efede8;
  --row: 200px; --gap: 4px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121211; --panel: #1b1b1a; --ink: #edebe6; --muted: #9a968e; --line: #2c2b29;
    --accent: #6b9cff; --accent-ink: #0d0d0c; --chip: #262523; --hover: #232321;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  display: grid; grid-template-columns: 260px 1fr; grid-template-rows: auto 1fr;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

header {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 16px;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
.brand { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; margin-right: 8px; }
nav { display: flex; gap: 2px; }
nav button, .seg button {
  border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; color: var(--muted);
}
nav button:hover, .seg button:hover { background: var(--hover); color: var(--ink); }
nav button.on, .seg button.on { background: var(--chip); color: var(--ink); font-weight: 600; }
.spacer { flex: 1; }
.tools { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.tools select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
#scan { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
#scan progress { width: 90px; accent-color: var(--accent); }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 10px;
}
.btn:hover { background: var(--hover); }

aside {
  background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto;
  padding: 14px 12px; height: calc(100vh - 53px); position: sticky; top: 53px;
}
aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 4px 4px 8px; }
.seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; margin-bottom: 10px; }
.seg button { flex: 1; padding: 5px 4px; font-size: 12px; }
.person {
  display: flex; align-items: center; gap: 10px; padding: 5px 6px; border-radius: 8px; cursor: pointer;
  user-select: none;
}
.person:hover { background: var(--hover); }
.person input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.person img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: var(--chip); }
.person .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .n.unnamed { color: var(--muted); font-style: italic; }
.person .c { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.empty-side { color: var(--muted); font-size: 13px; padding: 4px; }
.search {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; margin-bottom: 8px;
}
.more { color: var(--muted); font-size: 12px; padding: 6px; }
.people-bar { display: flex; align-items: center; gap: 12px; padding-top: 16px; color: var(--muted); }
.people-bar .search { max-width: 320px; margin: 0; }
.candidates { max-height: 50vh; overflow-y: auto; margin-top: 8px; }
.candidate { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 8px; cursor: pointer; }
.candidate:hover { background: var(--hover); }
.candidate .avatar-sm { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: var(--chip); flex: none; }
.candidate .avatar-sm img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 0.2s; }
.candidate .avatar-sm img.ok { opacity: 1; }
.candidate .n { flex: 1; }
.candidate .c { color: var(--muted); font-size: 12px; }
.merge-pair { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 14px 0 10px; }
.merge-pair figure { margin: 0; text-align: center; width: 150px; }
.merge-pair .avatar { width: 96px; height: 96px; cursor: default; }
.merge-pair figcaption { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.merge-pair figcaption.unnamed { color: var(--muted); font-style: italic; font-weight: 400; }
.merge-pair .s { color: var(--muted); font-size: 12px; }
.merge-pair .arrow { font-size: 26px; color: var(--muted); }
.merge-note { text-align: center; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.dlg-actions .btn { padding: 7px 16px; }

main { overflow-y: auto; height: calc(100vh - 53px); padding: 0 16px 40px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 0 0; min-height: 12px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 999px;
  padding: 3px 4px 3px 10px; font-size: 12px;
}
.chip button { border: 0; background: transparent; color: var(--muted); padding: 0 6px; font-size: 14px; line-height: 1; }
.chip button:hover { color: var(--ink); }
.count { color: var(--muted); font-size: 12px; padding: 12px 0 0; }

.group h2 {
  font-size: 15px; font-weight: 650; margin: 0; padding: 18px 0 8px; position: sticky; top: 0;
  background: linear-gradient(var(--bg) 75%, transparent); z-index: 2;
}
.group h2 small { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 12px; }
.group h4 { font-size: 13px; color: var(--muted); font-weight: 500; margin: 10px 0 6px; }
.grid { display: flex; flex-wrap: wrap; gap: var(--gap); }
.grid::after { content: ""; flex-grow: 1000000000; }
.tile {
  position: relative; height: var(--row); flex-grow: calc(var(--r) * 100); width: calc(var(--r) * var(--row));
  background: var(--chip); overflow: hidden; border-radius: 3px; cursor: zoom-in;
}
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile:hover img { filter: brightness(1.06); }
#sentinel { height: 1px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; padding-top: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; }
.card:hover { border-color: var(--muted); }
.card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--chip); }
.card .meta { padding: 8px 10px 10px; }
.card .t { font-weight: 600; }
.card .s { color: var(--muted); font-size: 12px; }

.people-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
/* People grid: only the visible cards exist in the page (see mountPeopleGrid). Cards are
   kept while they stay on screen and slide to new places instead of being rebuilt. */
.vgrid { position: relative; margin-top: 16px; }
.vcard { position: absolute; left: 0; top: 0; }
.vgrid.animate .vcard { transition: transform 0.28s cubic-bezier(0.2, 0.7, 0.3, 1); }
.vcard.enter, .vgrid.fade-in { animation: fade-in 0.22s ease both; }
.vcard.leave { animation: fade-out 0.2s ease forwards; pointer-events: none; }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; scale: 0.92; } }
@media (prefers-reduced-motion: reduce) {
  .vgrid.animate .vcard { transition: none; }
  .vcard.enter, .vgrid.fade-in, .vcard.leave { animation-duration: 1ms; }
}
.face-card { text-align: center; padding: 14px 10px 10px; cursor: default; height: 222px; }
.avatar {
  width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 8px; overflow: hidden; cursor: pointer;
  background: var(--chip);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 0.2s; }
.avatar img.ok { opacity: 1; }
.face-card input {
  width: 100%; border: 1px solid transparent; background: transparent; text-align: center; border-radius: 6px;
  padding: 3px; font-weight: 600;
}
.face-card input:hover, .face-card input:focus { border-color: var(--line); background: var(--bg); outline: none; }
.face-card input::placeholder { color: var(--muted); font-weight: 400; font-style: italic; }
.face-card .row { display: flex; gap: 4px; justify-content: center; margin-top: 6px; }
.face-card .btn { font-size: 11px; padding: 3px 6px; max-width: 100%; }
.face-card.hidden-person { opacity: 0.5; }

/* Loading placeholders */
.shimmer, .avatar:has(img:not(.ok)), .candidate .avatar-sm:has(img:not(.ok)) {
  background: linear-gradient(90deg, var(--chip) 0%, var(--hover) 50%, var(--chip) 100%);
  background-size: 200% 100%; animation: shimmer 1.2s linear infinite;
}
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.skeleton .avatar { cursor: default; }
.skeleton .line { height: 12px; border-radius: 6px; margin: 10px auto 0; width: 70%; }
.skeleton .line.short { width: 40%; }
.spinner {
  width: 26px; height: 26px; border-radius: 50%; margin: 28px auto; border: 3px solid var(--chip);
  border-top-color: var(--accent); animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .shimmer, .avatar, .spinner { animation-duration: 3s; } }

/* Short notices after an action */
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 13px; z-index: 30;
  transition: opacity 0.2s, transform 0.2s; max-width: calc(100vw - 32px);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.error { background: #b42318; color: #fff; }

.upbar { display: flex; align-items: center; gap: 10px; padding-top: 16px; color: var(--muted); }
.upbar .seg { margin: 0; }
.upbar .seg button { white-space: nowrap; padding: 5px 10px; }
.blank { color: var(--muted); padding: 60px 0; text-align: center; }

#viewer {
  position: fixed; inset: 0; background: rgba(8, 8, 8, 0.96); z-index: 20; display: none;
  grid-template-columns: 1fr 300px; color: #eee;
}
#viewer.open { display: grid; }
#viewer .stage { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#viewer .frame { position: relative; max-width: calc(100% - 120px); max-height: calc(100vh - 40px); }
#viewer .frame img { display: block; max-width: 100%; max-height: calc(100vh - 40px); object-fit: contain; }
#viewer .box { position: absolute; border: 2px solid rgba(255, 255, 255, 0.85); border-radius: 4px; display: none; }
#viewer.boxes .box { display: block; }
#viewer .box span {
  position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 3px; white-space: nowrap;
  background: rgba(0, 0, 0, 0.7); padding: 1px 6px; border-radius: 4px; font-size: 11px;
}
#viewer .nav {
  position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255, 255, 255, 0.08); border: 0;
  color: #fff; width: 44px; height: 64px; border-radius: 10px; font-size: 22px;
}
#viewer .nav:hover { background: rgba(255, 255, 255, 0.18); }
#viewer .prev { left: 12px; } #viewer .next { right: 12px; }
#viewer .close { position: absolute; top: 12px; left: 12px; background: transparent; border: 0; color: #fff; font-size: 24px; }
#viewer .info { background: #161615; border-left: 1px solid #2a2a28; padding: 20px 18px; overflow-y: auto; }
#viewer .info h3 { margin: 0 0 4px; font-size: 16px; }
#viewer .info .s { color: #a5a29b; font-size: 12px; margin-bottom: 14px; word-break: break-all; }
#viewer .info h5 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #8b8880; margin: 16px 0 8px; }
.vface { display: flex; align-items: center; gap: 10px; padding: 5px; border-radius: 8px; }
.vface:hover { background: #242422; }
.vface img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
.vface .n { flex: 1; cursor: pointer; }
.vface .n.unnamed { color: #9a968e; font-style: italic; }
.vface button { background: transparent; border: 1px solid #3a3936; color: #bbb; border-radius: 6px; font-size: 11px; padding: 2px 6px; }
.vface button:hover { color: #fff; border-color: #777; }
.info a { color: #9dbaff; }
.info label { display: flex; gap: 8px; align-items: center; color: #bbb; font-size: 12px; margin-top: 16px; }

dialog {
  border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink);
  padding: 0; width: min(620px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}
dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
.dlg-head { display: flex; align-items: center; padding: 16px 18px 6px; }
.dlg-head h3 { margin: 0; font-size: 16px; flex: 1; }
.dlg-head button { border: 0; background: transparent; font-size: 18px; color: var(--muted); }
.dlg-body { padding: 6px 18px 18px; }
.dlg-body p { color: var(--muted); margin: 4px 0 12px; font-size: 13px; }
.folder { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.folder .p { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.folder .c { color: var(--muted); font-size: 12px; white-space: nowrap; }
.folder .off { color: #c2410c; font-size: 12px; white-space: nowrap; }
.add-row { display: flex; gap: 8px; margin-top: 14px; }
.add-row input { flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.err { color: #c2410c; font-size: 12px; margin-top: 8px; min-height: 1em; }
.welcome { text-align: center; padding: 90px 16px; }
.welcome h2 { font-size: 22px; margin: 0 0 8px; }
.welcome p { color: var(--muted); margin: 0 0 20px; }

@media (max-width: 760px) {
  body { grid-template-columns: 1fr; }
  aside { display: none; }
  header { flex-wrap: wrap; gap: 8px; }
  .tools { width: 100%; }
  :root { --row: 120px; }
  #viewer { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  #viewer .info { max-height: 35vh; }
}
</style>
</head>
<body>
<header>
  <div class="brand">totufoto</div>
  <nav id="tabs">
    <button data-view="photos" class="on">Photos</button>
    <button data-view="places">Places</button>
    <button data-view="upcoming">Upcoming</button>
    <button data-view="people">People</button>
  </nav>
  <div class="spacer"></div>
  <div class="tools">
    <label>Group
      <select id="groupBy">
        <option value="month">by month</option>
        <option value="day">by day</option>
        <option value="year">by year</option>
        <option value="place">by place</option>
        <option value="none">no groups</option>
      </select>
    </label>
    <select id="sort" title="Sort by capture date">
      <option value="desc">Newest first</option>
      <option value="asc">Oldest first</option>
    </select>
    <div id="scan"></div>
    <button class="btn" id="foldersBtn" title="Choose the folders with your photos">Folders</button>
  </div>
</header>

<aside>
  <h3>People in the photo</h3>
  <div class="seg" id="match" title="How to combine the selected people">
    <button data-m="all" class="on" title="Photos where all selected people appear together">Together</button>
    <button data-m="any" title="Photos with at least one of the selected people">Any</button>
    <button data-m="only" title="Photos with exactly the selected people and nobody else you know">Only them</button>
  </div>
  <input class="search" id="peopleFilter" type="search" placeholder="Search people" autocomplete="off">
  <div id="peopleList"></div>
</aside>

<main id="main"></main>

<div id="toast" role="status" aria-live="polite"></div>

<dialog id="mergeDlg">
  <div class="dlg-head"><h3 id="mergeTitle">Same person as…</h3><button data-close title="Close">✕</button></div>
  <div class="dlg-body">
    <div id="mergePick">
      <p>Pick who this is. Their photos are combined into one person.</p>
      <input class="search" id="mergeFilter" type="search" placeholder="Search people" autocomplete="off">
      <div class="candidates"></div>
    </div>
    <div id="mergeConfirm" hidden></div>
  </div>
</dialog>

<dialog id="foldersDlg">
  <div class="dlg-head"><h3>Photo folders</h3><button data-close title="Close">✕</button></div>
  <div class="dlg-body"></div>
</dialog>

<div id="viewer">
  <div class="stage">
    <button class="close" title="Close (Esc)">✕</button>
    <button class="nav prev" title="Previous (←)">‹</button>
    <div class="frame"><img alt=""><div class="boxes"></div></div>
    <button class="nav next" title="Next (→)">›</button>
  </div>
  <div class="info"></div>
</div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const regionName = (() => {
  try { const d = new Intl.DisplayNames([navigator.language], { type: "region" }); return cc => { try { return d.of(cc); } catch { return cc; } }; }
  catch { return cc => cc; }
})();
const MONTHS = Array.from({ length: 12 }, (_, i) => new Date(2000, i, 1).toLocaleString(undefined, { month: "long" }));
const fmtDay = t => new Date(+t.slice(0, 4), +t.slice(5, 7) - 1, +t.slice(8, 10))
  .toLocaleDateString(undefined, { weekday: "short", year: "numeric", month: "long", day: "numeric" });
const fmtFull = t => fmtDay(t) + " · " + t.slice(11, 16);

const state = {
  view: "photos", sort: "desc", groupBy: "month", match: "all",
  people: new Set(), place: null, date: null, upcoming: 30,
};
let people = [], places = [], placeById = new Map(), photos = [], viewerIndex = -1, renderToken = 0;

// ---- URL state -------------------------------------------------------------
function saveHash() {
  const p = new URLSearchParams();
  if (state.view !== "photos") p.set("view", state.view);
  if (state.sort !== "desc") p.set("sort", state.sort);
  if (state.groupBy !== "month") p.set("group", state.groupBy);
  if (state.match !== "all") p.set("match", state.match);
  if (state.people.size) p.set("people", [...state.people].join(","));
  if (state.place) p.set("place", state.place);
  if (state.date) p.set("date", state.date);
  if (state.upcoming !== 30) p.set("days", state.upcoming);
  history.replaceState(null, "", "#" + p.toString());
}
function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  state.view = p.get("view") || "photos";
  state.sort = p.get("sort") || "desc";
  state.groupBy = p.get("group") || "month";
  state.match = p.get("match") || "all";
  state.people = new Set((p.get("people") || "").split(",").filter(Boolean).map(Number));
  state.place = p.get("place") ? Number(p.get("place")) : null;
  state.date = p.get("date");
  state.upcoming = Number(p.get("days") || 30);
}

// ---- data ------------------------------------------------------------------
const api = async (url, opts) => {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 || r.status === 202 ? null : r.json();
};
const post = (url, body) => api(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body ?? {}) });

async function loadMeta() {
  [people, places] = await Promise.all([api("/api/people"), api("/api/places")]);
  placeById = new Map(places.map(p => [p.id, p]));
  const known = new Set(people.map(p => p.id));
  for (const id of state.people) if (!known.has(id)) state.people.delete(id);
  renderPeopleList();
}
const personName = p => p.name || `Unnamed #${p.id}`;
const placeLabel = id => { const p = placeById.get(id); return p ? `${p.city}, ${regionName(p.country)}` : "Unknown place"; };

function photoQuery(extra = {}) {
  const q = new URLSearchParams({ sort: state.sort, ...extra });
  if (state.people.size) { q.set("people", [...state.people].join(",")); q.set("match", state.match); }
  if (state.place) q.set("place", state.place);
  if (state.date) q.set("date", state.date);
  return "/api/photos?" + q;
}

// ---- sidebar ---------------------------------------------------------------
// People keep their place on screen while you work: renaming someone (named people sort
// first) or refreshing counts must not reshuffle the list under you. The order is taken
// fresh from the server when the People tab is opened; new people are added at the end.
let peopleOrder = [], orderedCache = null;
function resetPeopleOrder() { peopleOrder = people.map(p => p.id); orderedCache = null; }
function orderedPeople() {
  // Recomputed only when the people list or the order changed.
  if (orderedCache && orderedCache.source === people && orderedCache.order === peopleOrder) return orderedCache.out;
  const byId = new Map(people.map(p => [p.id, p]));
  const out = [];
  for (const id of peopleOrder) { const p = byId.get(id); if (p) { out.push(p); byId.delete(id); } }
  for (const p of people) if (byId.has(p.id)) out.push(p);
  peopleOrder = out.map(p => p.id);
  orderedCache = { source: people, order: peopleOrder, out };
  return out;
}

/** People whose name matches `query`, in display order. */
function matchPeople(query, list = orderedPeople()) {
  const q = query.trim().toLowerCase();
  return q ? list.filter(p => personName(p).toLowerCase().includes(q)) : list;
}

// Large libraries can have thousands of face groups: the sidebar shows the selected
// people plus the top matches, and search finds the rest. Rows are reused between
// updates, so pictures don't reload and nothing flashes.
const SIDEBAR_LIMIT = 150;
const sidebarRows = new Map();
function sidebarRow(p) {
  let row = sidebarRows.get(p.id);
  if (!row) {
    row = document.createElement("label");
    row.className = "person";
    row.innerHTML = `<input type="checkbox" data-id="${p.id}"><img loading="lazy" alt=""><span class="n"></span><span class="c"></span>`;
    sidebarRows.set(p.id, row);
  }
  const img = row.querySelector("img"), name = row.querySelector(".n");
  if (img.dataset.face !== String(p.face)) { img.dataset.face = p.face; img.src = `/face/${p.face}`; }
  row.title = personName(p);
  name.textContent = personName(p);
  name.classList.toggle("unnamed", !p.name);
  row.querySelector(".c").textContent = p.count;
  row.querySelector("input").checked = state.people.has(p.id);
  return row;
}
function renderPeopleList() {
  const list = $("#peopleList");
  const all = orderedPeople();
  const visible = all.filter(p => !p.hidden);
  $("#peopleFilter").hidden = visible.length <= 12;
  for (const b of $("#match").children) b.classList.toggle("on", b.dataset.m === state.match);
  if (!visible.length) {
    list.innerHTML = `<div class="empty-side">No people yet. Faces are grouped automatically while the library is indexed.</div>`;
    return;
  }
  const matches = matchPeople($("#peopleFilter").value, visible);
  const rest = matches.filter(p => !state.people.has(p.id));
  const shown = [...visible.filter(p => state.people.has(p.id)), ...rest.slice(0, SIDEBAR_LIMIT)];
  const hiddenCount = rest.length - SIDEBAR_LIMIT;
  const extra = document.createElement("div");
  extra.innerHTML = (hiddenCount > 0 ? `<div class="more">${hiddenCount.toLocaleString()} more. Search to find them.</div>` : "") +
    (!matches.length ? `<div class="empty-side">Nobody matches.</div>` : "");
  const rows = shown.map(sidebarRow);
  // Only touch the list when its rows changed; moving existing rows keeps their pictures.
  const current = [...list.children];
  const same = current.length === rows.length + extra.childElementCount && rows.every((r, i) => current[i] === r) &&
    extra.innerHTML === current.slice(rows.length).map(e => e.outerHTML).join("");
  if (!same) list.replaceChildren(...rows, ...extra.children);
  const keep = new Set(shown.map(p => p.id));
  for (const id of sidebarRows.keys()) if (!keep.has(id) && sidebarRows.size > 600) sidebarRows.delete(id);
}
$("#peopleFilter").addEventListener("input", renderPeopleList);
$("#peopleList").addEventListener("change", e => {
  const id = Number(e.target.dataset.id);
  e.target.checked ? state.people.add(id) : state.people.delete(id);
  if (state.view !== "photos" && state.view !== "upcoming") state.view = "photos";
  render();
});
$("#match").addEventListener("click", e => {
  if (!e.target.dataset.m) return;
  state.match = e.target.dataset.m;
  renderPeopleList();
  if (state.people.size) render();
  else saveHash();
});

// ---- photo grid ------------------------------------------------------------
function groupKey(p) {
  const t = p[3];
  switch (state.groupBy) {
    case "day": return t.slice(0, 10);
    case "month": return t.slice(0, 7);
    case "year": return t.slice(0, 4);
    case "place": return "p" + (p[4] ?? "");
    default: return "";
  }
}
function groupTitle(key, sample) {
  switch (state.groupBy) {
    case "day": return fmtDay(key);
    case "month": return `${MONTHS[+key.slice(5, 7) - 1]} ${key.slice(0, 4)}`;
    case "year": return key;
    case "place": return sample[4] == null ? "No location" : placeLabel(sample[4]);
    default: return "";
  }
}
function groupPhotos(list, keyFn) {
  const groups = [], index = new Map();
  for (const p of list) {
    const k = keyFn(p);
    let g = index.get(k);
    if (!g) { g = { key: k, items: [] }; index.set(k, g); groups.push(g); }
    g.items.push(p);
  }
  return groups;
}
const tile = p => `<a class="tile" data-id="${p[0]}" style="--r:${(p[1] / p[2]).toFixed(3)}" href="/original/${p[0]}">` +
  `<img src="/thumb/${p[0]}" loading="lazy" decoding="async" alt=""></a>`;

/** Renders groups progressively so huge libraries stay responsive. */
function renderGroups(container, groups, headerFn, subFn) {
  const token = renderToken;
  const sentinel = document.createElement("div");
  sentinel.id = "sentinel";
  container.append(sentinel);
  let gi = 0, ii = 0, currentGrid = null, currentSub = null;
  const BATCH = 400;
  function pump() {
    if (token !== renderToken) return observer.disconnect();
    let budget = BATCH, html = "";
    const frag = document.createDocumentFragment();
    while (budget > 0 && gi < groups.length) {
      const g = groups[gi];
      if (ii === 0) {
        const sec = document.createElement("section");
        sec.className = "group";
        if (headerFn) sec.innerHTML = headerFn(g);
        frag.append(sec);
        currentGrid = null; currentSub = sec;
      }
      const sub = subFn ? subFn(g.items[ii], ii ? g.items[ii - 1] : null) : null;
      if (sub || !currentGrid) {
        if (sub) currentSub.insertAdjacentHTML("beforeend", `<h4>${sub}</h4>`);
        currentGrid = document.createElement("div");
        currentGrid.className = "grid";
        currentSub.append(currentGrid);
      }
      html = "";
      let end = ii;
      while (end < g.items.length && budget > 0) {
        if (end > ii && subFn && subFn(g.items[end], g.items[end - 1])) break;
        html += tile(g.items[end]); end++; budget--;
      }
      currentGrid.insertAdjacentHTML("beforeend", html);
      ii = end;
      if (ii >= g.items.length) { gi++; ii = 0; }
    }
    container.insertBefore(frag, sentinel);
    if (gi >= groups.length) { observer.disconnect(); sentinel.remove(); }
  }
  const observer = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) pump(); }, { root: $("#main"), rootMargin: "1500px" });
  pump();
  observer.observe(sentinel);
}

function filterChips() {
  const chips = [];
  if (state.people.size) {
    const names = [...state.people].map(id => people.find(p => p.id === id)).filter(Boolean).map(personName);
    const joiner = { all: " & ", any: " or ", only: " & " }[state.match];
    chips.push([`${state.match === "only" ? "Only " : ""}${names.join(joiner)}`, "people"]);
  }
  if (state.place) chips.push([placeLabel(state.place), "place"]);
  if (state.date) chips.push([state.date, "date"]);
  return `<div class="filters">${chips.map(([label, k]) =>
    `<span class="chip">${esc(label)}<button data-clear="${k}" title="Remove filter">×</button></span>`).join("")}</div>`;
}
function onChipClick(e) {
  const k = e.target.dataset.clear;
  if (!k) return;
  if (k === "people") state.people.clear();
  else state[k] = null;
  renderPeopleList();
  render();
}

async function renderPhotos(main, token) {
  const data = await api(photoQuery());
  if (token !== renderToken) return;
  photos = data.photos;
  main.innerHTML = filterChips() + `<div class="count">${photos.length.toLocaleString()} photos</div>`;
  if (!photos.length) {
    const filtered = state.people.size || state.place || state.date;
    if (!filtered && !folderInfo.folders.length && folderInfo.managed) {
      main.innerHTML = `<div class="welcome"><h2>Welcome to totufoto</h2>
        <p>Add a folder with photos. It is indexed in the background, and subfolders are included.</p>
        <button class="btn primary" id="welcomeAdd">Add folder…</button></div>`;
      $("#welcomeAdd").onclick = () => folderInfo.desktop ? addFolder(null).then(ok => ok && render()).catch(err => alert(err.message)) : openFolders();
      return;
    }
    const msg = filtered ? "No photos match these filters." : "No photos yet. They appear here while the folders are indexed.";
    main.insertAdjacentHTML("beforeend", `<div class="blank">${msg}</div>`);
    return;
  }
  const groups = groupPhotos(photos, groupKey);
  const header = state.groupBy === "none" ? null :
    g => `<h2>${esc(groupTitle(g.key, g.items[0]))}<small>${g.items.length}</small></h2>`;
  renderGroups(main, groups, header);
}

async function renderUpcoming(main, token) {
  const data = await api(photoQuery({ upcoming: state.upcoming }));
  if (token !== renderToken) return;
  const order = new Map(data.days.map((d, i) => [d, i]));
  // Upcoming days first (today, tomorrow...), and within a day the most recent year first.
  photos = data.photos.slice().sort((a, b) =>
    order.get(a[3].slice(5, 10)) - order.get(b[3].slice(5, 10)) || b[3].localeCompare(a[3]));
  const opts = [7, 14, 30, 60, 90].map(d => `<button data-d="${d}" class="${d === state.upcoming ? "on" : ""}">${d} days</button>`).join("");
  main.innerHTML = `<div class="upbar">Memories from past years for the next <div class="seg" id="days">${opts}</div></div>` + filterChips();
  $("#days").addEventListener("click", e => { if (e.target.dataset.d) { state.upcoming = +e.target.dataset.d; render(); } });
  if (!photos.length) { main.insertAdjacentHTML("beforeend", `<div class="blank">No photos were taken on these dates in previous years.</div>`); return; }
  const thisYear = new Date().getFullYear();
  const groups = groupPhotos(photos, p => p[3].slice(5, 10));
  const header = g => {
    const idx = order.get(g.key);
    const [m, d] = g.key.split("-").map(Number);
    const label = new Date(thisYear, m - 1, d).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    const when = idx === 0 ? "Today" : idx === 1 ? "Tomorrow" : `In ${idx} days`;
    return `<h2>${when} · ${esc(label)}<small>${g.items.length}</small></h2>`;
  };
  const sub = (p, prev) => {
    if (prev && prev[3].slice(0, 4) === p[3].slice(0, 4)) return null;
    const y = +p[3].slice(0, 4), ago = thisYear - y;
    return `${ago} year${ago === 1 ? "" : "s"} ago · ${y}`;
  };
  renderGroups(main, groups, header, sub);
}

function renderPlaces(main) {
  if (!places.length) { main.innerHTML = `<div class="blank">No photos with GPS location yet.</div>`; return; }
  main.innerHTML = `<div class="cards">${places.map(p => `
    <div class="card" data-place="${p.id}">
      <img src="/thumb/${p.cover}" loading="lazy" alt="">
      <div class="meta"><div class="t">${esc(p.city)}</div>
      <div class="s">${esc([p.region, regionName(p.country)].filter(Boolean).join(", "))} · ${p.count} photo${p.count === 1 ? "" : "s"}</div></div>
    </div>`).join("")}</div>`;
}

// ---- people grid ---------------------------------------------------------------------
// Libraries can have tens of thousands of people, so only the cards on screen exist in the
// page. Everything else (opening dialogs, merging, searching) stays cheap because of that.
const CARD_MIN_W = 150, CARD_H = 222, GRID_GAP = 14, OVERSCAN_ROWS = 2;
let peopleGrid = null, peopleQuery = "";

// Faces fade in the first time they load; after that they show at once.
const loadedFaces = new Set();
function faceLoaded(img) { loadedFaces.add(img.dataset.face); img.classList.add("ok"); }
const faceImg = id => loadedFaces.has(String(id))
  ? `<img src="/face/${id}" alt="" data-face="${id}" class="ok">`
  : `<img src="/face/${id}" alt="" data-face="${id}" decoding="async" onload="faceLoaded(this)" onerror="faceLoaded(this)">`;
const faceCard = p => `
  <div class="card face-card ${p.hidden ? "hidden-person" : ""}" data-person="${p.id}">
    <div class="avatar" title="Show photos">${faceImg(p.face)}</div>
    <input value="${esc(p.name || "")}" placeholder="Add a name" data-rename="${p.id}">
    <div class="s">${p.count} photo${p.count === 1 ? "" : "s"}</div>
    <div class="row">
      <button class="btn" data-merge="${p.id}" title="Merge with another person">Same as…</button>
      <button class="btn" data-hide="${p.id}">${p.hidden ? "Show" : "Hide"}</button>
    </div>
  </div>`;
const skeletonCard = () => `
  <div class="card face-card skeleton" aria-hidden="true">
    <div class="avatar shimmer"></div><div class="line shimmer"></div><div class="line short shimmer"></div>
  </div>`;
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));

function mountPeopleGrid(host, { fadeIn = false } = {}) {
  const main = $("#main");
  host.innerHTML = `<div class="vgrid${fadeIn ? " fade-in" : ""}"></div>`;
  const outer = host.firstElementChild;
  const rowH = CARD_H + GRID_GAP;
  const cards = new Map(); // person id -> .vcard element
  const grid = { items: [], cols: 1, cardW: CARD_MIN_W };
  let animateTimer = 0;
  const pos = i => `translate(${(i % grid.cols) * (grid.cardW + GRID_GAP)}px, ${Math.floor(i / grid.cols) * rowH}px)`;

  function layout() {
    const w = outer.clientWidth;
    grid.cols = Math.max(1, Math.floor((w + GRID_GAP) / (CARD_MIN_W + GRID_GAP)));
    grid.cardW = (w - GRID_GAP * (grid.cols - 1)) / grid.cols;
    outer.style.height = `${Math.max(0, Math.ceil(grid.items.length / grid.cols) * rowH - GRID_GAP)}px`;
  }
  /** Updates a card's contents in place (no rebuild, so pictures and typing are kept). */
  function update(el, p) {
    const card = el.firstElementChild;
    card.classList.toggle("hidden-person", !!p.hidden);
    const input = card.querySelector("input");
    if (document.activeElement !== input && input.value !== (p.name || "")) input.value = p.name || "";
    card.querySelector(".s").textContent = `${p.count} photo${p.count === 1 ? "" : "s"}`;
    card.querySelector("[data-hide]").textContent = p.hidden ? "Show" : "Hide";
    if (card.querySelector("img").dataset.face !== String(p.face)) card.querySelector(".avatar").innerHTML = faceImg(p.face);
  }
  function draw({ animate = false } = {}) {
    if (animate) {
      outer.classList.add("animate");
      clearTimeout(animateTimer);
      animateTimer = setTimeout(() => outer.classList.remove("animate"), 350);
    }
    const top = outer.getBoundingClientRect().top - main.getBoundingClientRect().top;
    const firstRow = Math.max(0, Math.floor(-top / rowH) - OVERSCAN_ROWS);
    const lastRow = Math.ceil((main.clientHeight - top) / rowH) + OVERSCAN_ROWS;
    const first = firstRow * grid.cols, last = Math.min(grid.items.length, lastRow * grid.cols);
    const keep = new Set();
    for (let i = first; i < last; i++) {
      const p = grid.items[i];
      keep.add(p.id);
      let el = cards.get(p.id);
      if (!el) {
        el = document.createElement("div");
        el.className = animate ? "vcard enter" : "vcard";
        el.innerHTML = faceCard(p);
        el.style.transform = pos(i);
        el.style.width = `${grid.cardW}px`;
        outer.append(el);
        cards.set(p.id, el);
        continue;
      }
      update(el, p);
      const t = pos(i);
      if (el.style.transform !== t) el.style.transform = t;
      el.style.width = `${grid.cardW}px`;
    }
    const alive = new Set(grid.items.map(p => p.id));
    for (const [id, el] of cards) {
      if (keep.has(id)) continue;
      // Keep a card someone is typing in while it's still a person, even off screen.
      if (el.contains(document.activeElement) && alive.has(id)) continue;
      cards.delete(id);
      if (animate && !alive.has(id)) { el.classList.add("leave"); setTimeout(() => el.remove(), 220); }
      else el.remove();
    }
  }
  let raf = 0;
  const onScroll = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); };
  main.addEventListener("scroll", onScroll, { passive: true });
  const resize = new ResizeObserver(() => { layout(); draw(); });
  resize.observe(outer);
  grid.setItems = (next, opts) => { grid.items = next; layout(); draw(opts); };
  grid.destroy = () => { main.removeEventListener("scroll", onScroll); resize.disconnect(); clearTimeout(animateTimer); };
  return grid;
}

function peopleCountText(n) {
  return peopleQuery ? `${n.toLocaleString()} matching` : `${n.toLocaleString()} people`;
}
/** Redraws everything that shows people from the in-memory list (cheap). `animate` makes
 *  cards slide to their new places, for changes like a merge. */
function refreshPeopleViews({ animate = true } = {}) {
  renderPeopleList();
  if (!peopleGrid) return;
  const items = matchPeople(peopleQuery);
  peopleGrid.setItems(items, { animate });
  $("#peopleCount").textContent = peopleCountText(items.length);
}

const SKELETON_DELAY = 150;
async function renderPeople(main, token) {
  main.innerHTML = `<div class="people-bar">
      <input class="search" id="peopleSearch" type="search" placeholder="Search people" autocomplete="off" value="${esc(peopleQuery)}">
      <span id="peopleCount"></span>
    </div>
    <div id="peopleHost"></div>`;
  $("#peopleSearch").addEventListener("input", e => {
    peopleQuery = e.target.value;
    main.scrollTop = 0;
    refreshPeopleViews({ animate: false });
  });
  const host = $("#peopleHost");
  let placeholders = false;
  const show = () => {
    if (token !== renderToken) return;
    if (!people.length) { host.innerHTML = `<div class="blank">No faces found yet.</div>`; $("#peopleCount").textContent = ""; return; }
    if (!peopleGrid) {
      resetPeopleOrder(); // opening the tab is when the list gets sorted again
      peopleGrid = mountPeopleGrid(host, { fadeIn: placeholders });
    }
    refreshPeopleViews({ animate: false });
  };
  // What we already have shows at once. Placeholders only appear if loading is slow.
  if (people.length) show();
  else {
    $("#peopleCount").textContent = "Loading people…";
    setTimeout(() => {
      if (token === renderToken && !peopleGrid && !people.length) {
        placeholders = true;
        host.innerHTML = `<div class="cards people-grid">${skeletonCard().repeat(18)}</div>`;
      }
    }, SKELETON_DELAY);
  }
  await loadMeta();
  if (token !== renderToken) return;
  if (peopleGrid) refreshPeopleViews({ animate: true }); // fresh counts, in place
  else show();
}

// ---- merge dialog ------------------------------------------------------------------
let mergeFrom = null;
const MERGE_LIMIT = 40;
function openMerge(id) {
  mergeFrom = id;
  $("#mergeFilter").value = "";
  showMergeStep(null);
  // Open at once with a spinner; the list fills in on the next frame.
  $("#mergeDlg .candidates").innerHTML = `<div class="spinner" role="progressbar" aria-label="Loading"></div>`;
  $("#mergeDlg").showModal();
  $("#mergeFilter").focus();
  nextFrame().then(() => { if (mergeFrom === id && $("#mergeDlg").open) renderMergeCandidates(); });
}
/** Switches the dialog between picking a person (`into` null) and confirming the merge. */
function showMergeStep(into) {
  const picking = into == null;
  $("#mergePick").hidden = !picking;
  $("#mergeConfirm").hidden = picking;
  $("#mergeTitle").textContent = picking ? "Same person as…" : "Merge these people?";
  if (picking) return;
  const a = people.find(p => p.id === mergeFrom), b = people.find(p => p.id === into);
  const face = p => `<figure>
      <div class="avatar">${faceImg(p.face)}</div>
      <figcaption class="${p.name ? "" : "unnamed"}">${esc(personName(p))}</figcaption>
      <div class="s">${p.count} photo${p.count === 1 ? "" : "s"}</div>
    </figure>`;
  const resultName = b.name || a.name;
  $("#mergeConfirm").innerHTML = `
    <div class="merge-pair">${face(a)}<span class="arrow" aria-hidden="true">→</span>${face(b)}</div>
    <p class="merge-note">The photos of <b>${esc(personName(a))}</b> move to <b>${esc(personName(b))}</b>${resultName ? `, named <b>${esc(resultName)}</b>` : ""}. This can't be undone, but a wrong face can later be removed with <i>Not them</i> in the photo viewer.</p>
    <div class="dlg-actions">
      <button class="btn" data-back>Back</button>
      <button class="btn primary" data-confirm="${into}">Merge</button>
    </div>`;
  $("#mergeConfirm [data-confirm]").focus();
}
// The picker lists people A to Z (accents and case ignored, "Person 2" before "Person 10"),
// with unnamed people last. Sorted once per people list.
const nameCollator = new Intl.Collator(undefined, { sensitivity: "base", numeric: true });
let alphabeticalCache = null;
function peopleAlphabetical() {
  if (alphabeticalCache?.source === people) return alphabeticalCache.out;
  const out = [...people].sort((a, b) =>
    !a.name !== !b.name ? (a.name ? -1 : 1)
      : a.name ? nameCollator.compare(a.name, b.name) || a.id - b.id
      : a.id - b.id);
  alphabeticalCache = { source: people, out };
  return out;
}
function renderMergeCandidates() {
  const all = matchPeople($("#mergeFilter").value, peopleAlphabetical()).filter(p => p.id !== mergeFrom);
  $("#mergeDlg .candidates").innerHTML = all.slice(0, MERGE_LIMIT).map(p => `
    <div class="candidate" data-into="${p.id}">
      <div class="avatar-sm">${faceImg(p.face)}</div>
      <span class="n ${p.name ? "" : "unnamed"}">${esc(personName(p))}</span>
      <span class="c">${p.count} photo${p.count === 1 ? "" : "s"}</span>
    </div>`).join("") +
    (all.length > MERGE_LIMIT ? `<div class="more">${(all.length - MERGE_LIMIT).toLocaleString()} more. Type a name to narrow it down.</div>` : "") +
    (!all.length ? `<div class="more">Nobody matches.</div>` : "");
}
$("#mergeFilter").addEventListener("input", renderMergeCandidates);
$("#mergeDlg").addEventListener("click", e => {
  const dlg = $("#mergeDlg");
  if (e.target === dlg || e.target.dataset.close != null) return dlg.close();
  if (e.target.dataset.back != null) { showMergeStep(null); return $("#mergeFilter").focus(); }
  const row = e.target.closest("[data-into]");
  if (row) return showMergeStep(+row.dataset.into);
  if (!e.target.dataset.confirm) return;
  dlg.close();
  mergePeople(mergeFrom, +e.target.dataset.confirm);
});

// ---- people changes: shown at once, saved in the background ---------------------------
let toastTimer = 0;
function toast(message, error = false) {
  const el = $("#toast");
  el.textContent = message;
  el.classList.toggle("error", error);
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), error ? 6000 : 2500);
}
/** Reloads the real numbers after a change (or restores them after a failed one). */
const resync = () => loadMeta().then(refreshPeopleViews).catch(() => {});

function mergePeople(from, into) {
  const a = people.find(p => p.id === from), b = people.find(p => p.id === into);
  if (!a || !b) return;
  const label = `${personName(a)} into ${personName(b)}`;
  const orderBefore = peopleOrder; // so a failed merge puts the person back in their place
  b.count += a.count; // exact count (photos with both) comes with the resync
  if (!b.name) b.name = a.name;
  people = people.filter(p => p.id !== from);
  if (state.people.delete(from)) state.people.add(into);
  refreshPeopleViews();
  toast(`Merged ${label}`);
  post(`/api/people/${from}/merge`, { into })
    .then(resync)
    .catch(err => {
      toast(`Couldn't merge ${label}: ${err.message}`, true);
      peopleOrder = orderBefore;
      orderedCache = null;
      resync();
    });
}

function toggleHidden(id) {
  const p = people.find(p => p.id === id);
  if (!p) return;
  p.hidden = !p.hidden;
  refreshPeopleViews();
  post(`/api/people/${id}`, { hidden: p.hidden })
    .catch(err => { toast(`Couldn't save: ${err.message}`, true); resync(); });
}

function renamePerson(id, value) {
  const p = people.find(p => p.id === id);
  const name = value.trim() || null;
  if (!p || p.name === name) return;
  p.name = name;
  alphabeticalCache = null;
  renderPeopleList();
  post(`/api/people/${id}`, { name: value })
    .then(resync)
    .catch(err => { toast(`Couldn't save the name: ${err.message}`, true); resync(); });
}

async function render() {
  saveHash();
  for (const b of $("#tabs").children) b.classList.toggle("on", b.dataset.view === state.view);
  $("#groupBy").value = state.groupBy;
  $("#sort").value = state.sort;
  const main = $("#main");
  const token = ++renderToken;
  peopleGrid?.destroy();
  peopleGrid = null;
  main.scrollTop = 0;
  try {
    if (state.view === "photos") await renderPhotos(main, token);
    else if (state.view === "upcoming") await renderUpcoming(main, token);
    else if (state.view === "places") renderPlaces(main);
    else await renderPeople(main, token);
  } catch (err) {
    main.innerHTML = `<div class="blank">Something went wrong: ${esc(err.message)}</div>`;
  }
}

// ---- main area events ---------------------------------------------------------
$("#main").addEventListener("click", e => {
  if (e.target.dataset.clear) return onChipClick(e);
  const t = e.target.closest(".tile");
  if (t) { e.preventDefault(); return openViewer(photos.findIndex(p => p[0] === +t.dataset.id)); }
  const place = e.target.closest("[data-place]");
  if (place) { state.place = +place.dataset.place; state.view = "photos"; return render(); }
  if (e.target.dataset.merge) return openMerge(+e.target.dataset.merge);
  if (e.target.dataset.hide) return toggleHidden(+e.target.dataset.hide);
  if (e.target.closest(".face-card:not(.skeleton) .avatar")) {
    state.people = new Set([+e.target.closest("[data-person]").dataset.person]);
    state.view = "photos"; renderPeopleList(); return render();
  }
});
$("#main").addEventListener("change", e => {
  if (e.target.dataset.rename) renamePerson(+e.target.dataset.rename, e.target.value);
});
$("#main").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset.rename) e.target.blur(); });

$("#tabs").addEventListener("click", e => { if (e.target.dataset.view) { state.view = e.target.dataset.view; render(); } });
$("#groupBy").addEventListener("change", e => { state.groupBy = e.target.value; if (state.view !== "photos") state.view = "photos"; render(); });
$("#sort").addEventListener("change", e => { state.sort = e.target.value; render(); });

// ---- viewer ----------------------------------------------------------------
const viewer = $("#viewer");
async function openViewer(i) {
  if (i < 0 || i >= photos.length) return;
  viewerIndex = i;
  const id = photos[i][0];
  viewer.classList.add("open");
  const img = $(".frame img", viewer);
  img.src = `/thumb/${id}`;
  const full = new Image();
  full.onload = () => { if (viewerIndex === i) img.src = full.src; };
  full.src = `/original/${id}`;
  for (const j of [i - 1, i + 1]) if (photos[j]) new Image().src = `/thumb/${photos[j][0]}`;
  const d = await api(`/api/photos/${id}`);
  if (viewerIndex !== i) return;
  $(".boxes", viewer).innerHTML = d.faces.map(f => {
    const person = people.find(p => p.id === f.person);
    const label = person ? personName(person) : "";
    return `<div class="box" style="left:${f.box[0] * 100}%;top:${f.box[1] * 100}%;width:${f.box[2] * 100}%;height:${f.box[3] * 100}%">${label ? `<span>${esc(label)}</span>` : ""}</div>`;
  }).join("");
  const place = d.city ? `${d.city}${d.region ? ", " + d.region : ""}, ${regionName(d.country)}` : null;
  $(".info", viewer).innerHTML = `
    <h3>${esc(fmtFull(d.taken))}</h3>
    <div class="s">${d.dateFromExif ? "" : "Date from file (no EXIF) · "}${d.width} × ${d.height}</div>
    ${place ? `<h5>Place</h5><div>${esc(place)}</div><div class="s"><a href="https://www.openstreetmap.org/?mlat=${d.lat}&mlon=${d.lon}#map=14/${d.lat}/${d.lon}" target="_blank" rel="noopener">Open map</a></div>` : ""}
    <h5>People (${d.faces.length})</h5>
    ${d.faces.length ? d.faces.map(f => {
      const person = people.find(p => p.id === f.person);
      return `<div class="vface"><img src="/face/${f.id}" alt="">
        <span class="n ${person?.name ? "" : "unnamed"}" data-person="${f.person ?? ""}">${person ? esc(personName(person)) : "Not grouped"}</span>
        ${person ? `<button data-reject="${f.id}" title="This face is not ${esc(personName(person))}: move it to a new group you can rename or hide">Not them</button>` : ""}</div>`;
    }).join("") : `<div class="s">No faces detected.</div>`}
    <label><input type="checkbox" id="showBoxes" ${viewer.classList.contains("boxes") ? "checked" : ""}> Show face boxes</label>
    <h5>File</h5><div class="s">${esc(d.path)}</div>`;
}
function closeViewer() { viewer.classList.remove("open"); viewerIndex = -1; $(".frame img", viewer).src = ""; }
$(".close", viewer).onclick = closeViewer;
$(".prev", viewer).onclick = () => openViewer(viewerIndex - 1);
$(".next", viewer).onclick = () => openViewer(viewerIndex + 1);
$(".stage", viewer).addEventListener("click", e => { if (e.target.classList.contains("stage")) closeViewer(); });
$(".info", viewer).addEventListener("change", e => { if (e.target.id === "showBoxes") viewer.classList.toggle("boxes", e.target.checked); });
$(".info", viewer).addEventListener("click", async e => {
  const link = e.target.closest("a[target=_blank]");
  if (link && folderInfo.desktop) { e.preventDefault(); return post("/api/open", { url: link.href }); }
  if (e.target.dataset.reject) {
    e.target.disabled = true;
    try {
      const { person } = await post(`/api/faces/${e.target.dataset.reject}/reject`);
      toast(`Moved to a new group, Unnamed #${person}. Rename or hide it in People.`);
    } catch (err) {
      toast(`Couldn't move the face: ${err.message}`, true);
    }
    await loadMeta();
    openViewer(viewerIndex);
  } else if (e.target.dataset.person) {
    state.people = new Set([+e.target.dataset.person]);
    state.view = "photos"; closeViewer(); renderPeopleList(); render();
  }
});
document.addEventListener("keydown", e => {
  if (!viewer.classList.contains("open")) return;
  if (e.key === "Escape") closeViewer();
  else if (e.key === "ArrowLeft") openViewer(viewerIndex - 1);
  else if (e.key === "ArrowRight") openViewer(viewerIndex + 1);
});

// ---- folders -----------------------------------------------------------------------
let folderInfo = { folders: [], managed: true, desktop: false };
async function loadFolders() {
  folderInfo = await api("/api/folders");
  return folderInfo;
}
async function addFolder(path) {
  const r = await fetch(path == null ? "/api/folders/pick" : "/api/folders", {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(path == null ? {} : { path }),
  });
  if (r.status === 204) return false; // picker cancelled
  if (!r.ok) throw new Error(await r.text());
  await loadFolders();
  setTimeout(pollStatus, 300);
  return true;
}
function renderFoldersDialog(error = "") {
  const dlg = $("#foldersDlg"), body = $(".dlg-body", dlg);
  const { folders, managed, desktop } = folderInfo;
  const list = folders.length ? folders.map(f => `
    <div class="folder">
      <span class="p" title="${esc(f.path)}"><bdi>${esc(f.path)}</bdi></span>
      ${f.available ? `<span class="c">${f.photos.toLocaleString()} photos</span>` : `<span class="off" title="The folder can't be found right now. Its photos are kept until it's back or you remove it.">not available</span>`}
      ${managed ? `<button class="btn" data-remove="${esc(f.path)}">Remove</button>` : ""}
    </div>`).join("") : `<p>No folders yet.</p>`;
  const add = !managed ? `<p>These folders were given on the command line. Start the app without folders to manage them here.</p>`
    : desktop ? `<div class="add-row"><button class="btn primary" data-pick>Add folder…</button></div>`
    : `<div class="add-row"><input id="folderPath" placeholder="/path/to/photos" spellcheck="false"><button class="btn primary" data-add>Add</button></div>`;
  body.innerHTML = `<p>Subfolders are included. Photos are only read, never changed.</p>${list}${add}<div class="err">${esc(error)}</div>`;
}
function openFolders() {
  renderFoldersDialog();
  const dlg = $("#foldersDlg");
  if (!dlg.open) dlg.showModal();
  $("#folderPath")?.focus();
}
$("#foldersBtn").onclick = () => loadFolders().then(openFolders);
$("#foldersDlg").addEventListener("click", async e => {
  const dlg = $("#foldersDlg");
  if (e.target === dlg || e.target.dataset.close != null) return dlg.close();
  try {
    if (e.target.dataset.pick != null) { if (await addFolder(null)) renderFoldersDialog(); }
    else if (e.target.dataset.add != null) { await addFolder($("#folderPath").value); renderFoldersDialog(); }
    else if (e.target.dataset.remove) {
      if (!confirm(`Remove this folder from the gallery?\n\n${e.target.dataset.remove}\n\nThe photos stay on disk; they are only removed from the gallery.`)) return;
      await post("/api/folders/remove", { path: e.target.dataset.remove });
      await loadFolders(); renderFoldersDialog(); setTimeout(pollStatus, 300);
    }
  } catch (err) { renderFoldersDialog(err.message); }
});
$("#foldersDlg").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "folderPath") $("[data-add]")?.click(); });
$("#foldersDlg").addEventListener("close", () => { if (!photos.length) render(); });

// ---- scan status -----------------------------------------------------------------
let wasRunning = false;
async function pollStatus() {
  let s;
  try { s = await api("/api/status"); } catch { return setTimeout(pollStatus, 5000); }
  const el = $("#scan");
  if (s.running) {
    el.innerHTML = `<span>${esc(s.phase)} ${s.done}/${s.total}</span><progress max="${s.total || 1}" value="${s.done}"></progress>`;
  } else {
    el.innerHTML = `<button class="btn" id="rescan" title="Look for new or changed photos">Rescan</button>`;
    $("#rescan").onclick = () => post("/api/scan").then(() => setTimeout(pollStatus, 300));
  }
  if (wasRunning && !s.running) { await Promise.all([loadMeta(), loadFolders()]); render(); }
  // During the first index, show photos as soon as some are in instead of waiting for the end.
  else if (s.running && s.done > 0 && !photos.length && state.view === "photos" && !viewer.classList.contains("open")) render();
  wasRunning = s.running;
  setTimeout(pollStatus, s.running ? 1500 : 10000);
}

loadHash();
Promise.all([loadMeta(), loadFolders()]).then(render);
pollStatus();
</script>
</body>
</html>
